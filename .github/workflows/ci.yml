name: CI

# Las acciones van todas en su ultima version mayor, salvo una.
#
# El motivo del salto: el runner llevaba avisando de que Node 20 esta
# descatalogado y estaba forzando esas acciones a ejecutarse sobre Node 24 --o
# sea, ya corrian donde no declaraban--. El aviso estaba anotado desde el Hito 0
# como algo que un dia tumbaria la CI sin haber tocado nada.
#
# **gradle/actions se queda deliberadamente en v5 y no sube a v6.** No es
# descuido ni pereza: la v6 saca el cacheo a una libreria aparte,
# `gradle-actions-caching`, que **ya no es codigo abierto**, y elimina el soporte
# de configuration-cache a la espera de reimplementarlo alli. Eso no es una
# version mas sino un cambio en la naturaleza de lo que se ejecuta en la
# integracion, y merece decidirse a proposito. La v5 hace lo que hacia falta
# --subir a Node 24-- y nada mas.
#
# El unico cambio rompedor que podria habernos afectado es el de
# `actions/checkout` a partir de v5: cambia los valores por defecto de
# `pull_request_target`. Este workflow dispara con `pull_request`, asi que no le
# aplica.

on:
  push:
    branches: [main]
  pull_request:

# El token de la integracion, con lo minimo: **leer el codigo y nada mas**.
#
# Sin este bloque hereda lo que tenga configurado el repositorio, que puede ser
# escritura, y ninguno de los cinco trabajos la necesita --clonan, construyen y
# publican informes, y la publicacion de artefactos no va por este token--. Es
# la contencion que hace que una accion comprometida no pueda escribir en el
# repositorio: hoy van fijadas por etiqueta mayor, que es mutable, asi que la
# superficie existe (ver la auditoria OWASP).
permissions:
  contents: read

# Un push nuevo sobre la misma rama cancela la ejecucion anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contrato y documentacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar el validador
        run: pip install pyyaml openapi-spec-validator

      - name: Validar el contrato
        run: python scripts/validate-openapi.py

      - name: Comprobar los enlaces relativos
        run: python scripts/check-links.py

      # La direccion visual dice que el contraste esta comprobado y no afirmado
      # (docs/frontend/product-design/look-and-feel.md). Esto es lo que lo hace
      # cierto: mide los tokens reales y falla si alguno baja de su minimo.
      - name: Comprobar el contraste de los tokens
        run: python scripts/check-contrast.py

      - name: Spectral
        run: npx --yes @stoplight/spectral-cli lint openapi.yaml --ruleset .spectral.yaml

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # Las pruebas que tocan la base de datos levantan PostgreSQL con
      # Testcontainers y corren con un usuario sujeto a RLS (ADR-003 y ADR-008).
      # El runner de ubuntu ya trae Docker.
      - name: Construir y probar
        run: ./gradlew build --no-daemon
        working-directory: backend

      - name: Publicar el informe de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  # La medicion que decidio el VPS al cerrar la Fase 1
  # (docs/backend/operations/capacity-measurements.md).
  #
  # Corre aqui y no en la maquina de nadie por un motivo concreto: **el runner es
  # Linux con 2 vCPU**, que se parece mucho mas a un VPS-2 que un portatil con
  # Docker Desktop. Los bytes son portables y se pueden medir en cualquier sitio;
  # los milisegundos no, y medirlos en Windows daba una variacion del doble entre
  # dos ejecuciones seguidas.
  #
  # No corta la integracion --`continue-on-error`-- porque no afirma nada: es un
  # instrumento, y una medicion que rompe la construccion cuando el runner va
  # cargado solo ensena a ignorarla. Lo que hace es dejar el numero registrado
  # para que el dia que suba se vea cuando subio.
  capacity:
    name: Medicion de capacidad
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Medir bytes por hogar y coste de CPU
        run: ./gradlew capacityMeasurement --no-daemon
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      - name: Comprobar tipos y construir
        run: npm run build
        working-directory: frontend

      - name: Probar
        run: npm test
        working-directory: frontend

  # El recorrido vertical en un navegador de verdad, que es la condicion que la
  # ADR-006 y la ADR-008 ponen y la que mantenia look-and-feel.md en Borrador.
  #
  # Es un trabajo aparte y no un paso mas del frontend porque necesita cosas que
  # aquel no: PostgreSQL, Mailpit, el backend construido y un navegador. Mezclarlo
  # haria que un fallo de tipos y un fallo de reflujo se parecieran en el informe.
  e2e:
    name: Recorrido vertical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # La aplicacion de verdad contra su base de datos y su servidor de correo,
      # no un doble: es lo que hace que esto sea un recorrido vertical y no una
      # prueba de componente con mas pasos.
      - name: Levantar PostgreSQL y Mailpit
        run: docker compose up -d postgres mailpit

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      # El navegador pesa unos 170 MB y **no cambia entre ejecuciones**: lo que lo
      # invalida es cambiar de version de Playwright, no tocar el codigo. Sin esto
      # se bajaba entero cada vez, que es lo que hacia lento este trabajo.
      #
      # La clave cuelga del `package-lock.json` y no de la version de Playwright
      # sola, y es una eleccion con coste: cambiar **cualquier** dependencia del
      # frontend invalida tambien el navegador y obliga a bajarlo otra vez.
      # Se acepta a proposito, porque el fallo contrario es mucho peor: una clave
      # demasiado estable sirve un binario que no corresponde a la version de
      # Playwright instalada, y eso no se manifiesta como una descarga de mas sino
      # como un navegador que no arranca por una razon que no se parece a la causa.
      - name: Cachear el navegador
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # **Sin `--with-deps`, y ese es el cambio que de verdad importa.** Esa opcion
      # es lo unico que traia un `apt-get` a este trabajo, y el 2026-08-19 fue
      # exactamente donde se colgo: el mirror del runner
      # --azure.archive.ubuntu.com-- dejo de responder, apt cayo al archivo de
      # Ubuntu, bajo los InRelease y **se quedo parado 71 minutos** hasta que
      # alguien cancelo el trabajo a mano. La imagen de `ubuntu-latest` ya trae las
      # bibliotecas que Chromium necesita --viene con Chrome instalado-- asi que
      # instalarlas otra vez era pagar un `apt-get` por nada.
      #
      # Si algun dia la imagen deja de traerlas, el sintoma **no** vuelve a ser un
      # cuelgue: es el navegador fallando al arrancar en el paso siguiente, que se
      # ve en segundos y dice cual falta. Cambiar un cuelgue de setenta minutos por
      # un fallo legible es la mitad del motivo de quitarlo.
      #
      # El paso se ejecuta igual con la cache caliente: `playwright install`
      # comprueba lo que hay y sale en el acto si ya esta. Es mas simple que
      # condicionarlo al acierto de la cache, y ademas se cura solo si la cache
      # llega a medias.
      #
      # El tope de diez minutos se queda aunque ya no haya apt: la descarga sigue
      # ahi el dia que la cache falle, y tiene que **dejar pasar lo lento y cortar
      # lo colgado**, que no son lo mismo.
      - name: Instalar el navegador
        run: npx playwright install chromium
        working-directory: frontend
        timeout-minutes: 10

      - name: Recorrido vertical y auditoria de accesibilidad
        run: npm run test:e2e
        working-directory: frontend

      - name: Publicar el informe
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
