# Vigilancia continua de dependencias.
#
# Es la otra mitad del hallazgo 5 de la auditoría OWASP, y la que de verdad
# importa a largo plazo: subir Spring Boot una vez cierra las CVE **de hoy**;
# esto es lo que hace que las de mañana las vea alguien. Sin ello, una CVE nueva
# no la detecta nadie hasta la siguiente auditoría manual — que es exactamente lo
# que pasó con `webp-imageio`, congelada desde 2020 en el repositorio.
#
# Los tres ecosistemas, porque los tres han dado un hallazgo:
#
# - `gradle`, donde estaban las CVE de Spring y la librería de imagen sin
#   mantener.
# - `npm`, hoy limpio (`npm audit` da cero), y precisamente por eso conviene que
#   siga vigilado sin que nadie se acuerde.
# - `github-actions`, que la auditoría marcó por ir fijado a etiqueta mayor
#   mutable: un tag se puede reapuntar, así que el compromiso de una acción
#   compromete la integración. Dependabot es lo que permite fijar por SHA sin
#   que quedarse atrás salga gratis.
#
# **Las alertas de seguridad del repositorio son aparte y no se configuran
# aquí**: Dependabot alerts, security updates y el escaneo de secretos con
# protección de push se activan en los ajustes del repositorio, y siguen
# pendientes (ver `docs/common/security/owasp-audit.md`).

version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Agrupado a propósito: el BOM de Spring Boot mueve decenas de artefactos a
    # la vez, y un pull request por cada uno convierte la vigilancia en ruido que
    # se acaba ignorando — que es la forma habitual de que esto deje de servir.
    groups:
      spring:
        patterns:
          - org.springframework*
          - org.springdoc*
      # **Los tres plugins de Kotlin van juntos: son una sola decisión.** La
      # primera versión de este fichero los dejó fuera, y Dependabot abrió el de
      # `jvm` y el de `plugin.spring` por separado, cada uno subiendo solo su
      # línea. Agruparlos evita que la versión de Kotlin se revise tres veces y
      # que `main` acabe en una combinación intermedia que nadie eligió — con un
      # plugin en una versión y los otros dos en otra.
      #
      # **Corrección de lo que decía aquí antes:** este comentario afirmaba que
      # fusionar uno solo rompería la construcción. Se comprobó después y **no es
      # cierto** — las dos propuestas pasaron la integración por separado, así
      # que el estado mixto compila. El motivo para agrupar es el de arriba, no
      # un fallo de construcción; y se deja escrita la corrección porque una
      # razón inventada es peor que ninguna: sobrevive a quien la escribió y se
      # cita como si estuviera medida.
      #
      # Hay además un motivo de calendario: Kotlin 2.2+ es requisito del salto a
      # Spring Boot 4, así que esa subida conviene mirarla como un bloque y no
      # como tres actualizaciones sueltas que entran por su cuenta.
      #
      # Los nombres son los cortos del DSL de Kotlin (`kotlin("jvm")`), que es
      # como los ve Dependabot, y no `org.jetbrains.kotlin.*`: con el patrón de
      # la forma larga el grupo no casaría con nada y **fallaría en silencio**,
      # que es exactamente el modo de fallo que esto viene a evitar. El último
      # patrón se queda como red por si algún día los nombra de la otra forma.
      kotlin:
        patterns:
          - jvm
          - plugin.*
          - org.jetbrains.kotlin*
      test:
        patterns:
          - org.testcontainers*
          - io.kotest*
          - com.tngtech.archunit*
    ignore:
      # **El salto a la línea 4.x de Spring Boot no lo hace Dependabot.** No es
      # una actualización sino una migración: arrastra Jackson 3 con cambio de
      # `groupId`, Kotlin 2.2+, Spring Security 7 e Hibernate 7, y la prueba está
      # hecha — la propuesta automática falló en tres trabajos de la integración.
      # Sin esto se reabre cada semana y gasta cinco trabajos en volver a fallar,
      # que además enseña a ignorar los fallos de la CI.
      #
      # **Corrección de lo que decía aquí antes.** Este comentario afirmaba que
      # un `ignore` «no oculta ninguna CVE» porque las actualizaciones de
      # seguridad son otro mecanismo. **La referencia de Dependabot dice lo
      # contrario**: el filtro de `ignore` se aplica también a las
      # actualizaciones de seguridad, así que puede suprimir el pull request
      # automático de arreglo. Lo que no toca son las **alertas**, que salen del
      # grafo de dependencias y no de este fichero: una vulnerabilidad se seguirá
      # viendo, pero puede que sin PR que la arregle sola.
      #
      # De ahí que estas reglas se escriban **lo más estrechas posible**: cada
      # una bloquea exactamente el salto que hay que decidir a mano y deja pasar
      # todo lo demás.
      - dependency-name: org.springframework.boot
        update-types: [version-update:semver-major]
      # springdoc va atado a Boot: su línea 3.x es la del Boot 4 y no sirve antes.
      - dependency-name: org.springdoc:*
        update-types: [version-update:semver-major]
      # Aquí vivió una tercera regla, la que fijaba `webp-imageio` en la línea
      # 0.10.x mientras el proyecto iba por Kotlin 2.1.20 —la 0.11.0 está
      # compilada con Kotlin 2.4 y su metadata no se podía leer—. **Se retira al
      # subir a Kotlin 2.4.10**, que era exactamente la condición que la regla
      # declaraba: una regla cuya condición se cumple y no se retira es deuda que
      # nadie vuelve a mirar, y acaba bloqueando algo por un motivo que dejó de
      # ser cierto.
      #
      # Se deja la nota, y no el silencio, para que la próxima vez que alguien
      # dude de si esto estuvo fijado encuentre la respuesta aquí.
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # El utillaje de desarrollo no llega al artefacto que se sirve, así que sus
      # subidas no son urgentes y sí numerosas: agruparlas las separa de lo que
      # sí viaja al navegador.
      #
      # **Solo `minor` y `patch`, y eso se aprendió por las malas.** La primera
      # versión agrupaba por tipo de dependencia sin mirar la magnitud del salto,
      # y el resultado fue un pull request con **siete versiones mayores a la
      # vez** —TypeScript 5→7, Vite 7→8, Vitest 3→4, jsdom, plugin-react y
      # jest-dom— que además fallaba. El error era pequeño y localizado
      # (TypeScript 7 endurece los imports de CSS por efecto secundario), pero
      # dentro de un cambio con siete mayores no hay forma de saber qué rompió
      # qué, ni de arreglar uno sin cargar con los otros seis.
      #
      # Agrupar lo rutinario es el objetivo; agrupar lo que hay que decidir es lo
      # contrario. Los mayores pasan a llegar **de uno en uno**, con su propia
      # integración y su propia decisión.
      tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # **`gradle/actions` se queda en v5 por decisión tomada**, y el motivo está
      # escrito en la cabecera de `workflows/ci.yml`: la v6 saca el cacheo a una
      # librería aparte que **ya no es código abierto** y elimina el soporte de
      # configuration-cache. Eso no es una versión más sino un cambio en la
      # naturaleza de lo que se ejecuta en la integración.
      #
      # Sin esta regla la propuesta vuelve cada semana, y quien la vea en verde
      # la fusionará sin saber que había una decisión detrás — que es justo cómo
      # se pierden las decisiones. Se revisa el día que el cacheo vuelva a ser
      # código abierto, no antes.
      - dependency-name: gradle/actions
        update-types: [version-update:semver-major]
    commit-message:
      prefix: ci
