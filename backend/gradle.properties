# Memoria del demonio de compilacion de Kotlin.
#
# **Esto no es una optimizacion: es lo que impide que la compilacion falle donde
# la memoria esta repartida.** Desde Kotlin 2.4 la compilacion pasa por la Build
# Tools API, que levanta su propio demonio, y ese demonio arranca con lo que el
# sistema le conceda. En un trabajo que ademas carga otra cosa pesada --el
# analisis de CodeQL, que instrumenta la construccion entera-- no queda bastante
# y la tarea muere con un mensaje que solo dice:
#
#   Execution failed for task ':compileKotlin'
#   > Not enough memory to run compilation. Try to increase it via
#     'gradle.properties': kotlin.daemon.jvmargs=-Xmx<size>
#
# El sintoma enganaba: fallaba en un pull request que **no tocaba una sola linea
# del backend**, mientras el trabajo `Backend` de la integracion --que corre solo
# y con `--no-daemon`-- pasaba sin quejarse.
#
# 2 GiB son de sobra para este backend --el modulo entero compila en menos-- y
# suficientemente contenidos para convivir con otro proceso grande en el mismo
# runner. Fijarlo a proposito vale ademas para cualquier maquina: dejar el heap
# al criterio del entorno es lo que hace que una construccion pase en un sitio y
# no en otro sin que nada del codigo haya cambiado.
kotlin.daemon.jvmargs=-Xmx2g
