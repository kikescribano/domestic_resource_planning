spring:
  application:
    name: drp

  datasource:
    # Usuario de la aplicacion: NO es el propietario del esquema y NO tiene
    # BYPASSRLS. Ver docker/postgres/init/01-app-role.sql y ADR-003.
    url: jdbc:postgresql://localhost:5432/drp
    username: drp_app
    password: drp_app

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # Flyway migra con el propietario del esquema, no con el usuario de la
    # aplicacion: crear tablas y politicas exige permisos que drp_app no tiene
    # ni debe tener.
    user: drp_owner
    password: drp_owner
    placeholders:
      # A quien se conceden las funciones de resolucion de inquilino
      # (V4__tenant_resolution.sql). Va como marcador y no escrito en la
      # migracion para que el nombre del rol de la aplicacion siga siendo
      # configuracion de despliegue y no algo grabado en el esquema.
      applicationRole: ${spring.datasource.username}

  mail:
    # Mailpit, levantado por compose.yaml. En produccion se sustituye por el
    # SMTP del proveedor sin tocar codigo (ADR-009).
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          # El nombre que se anuncia en el EHLO. Sin fijarlo, JavaMail lo
          # resuelve preguntando por el nombre local de la maquina, y esa
          # resolucion se va a varios segundos en algunos equipos --Windows,
          # sobre todo-- en cada envio.
          localhost: localhost
          # Tiempos de espera, para que un servidor SMTP que no conteste no deje
          # bloqueado el hilo que atiende la peticion. Treinta segundos y no
          # cinco: la primera version puso cinco y **rompio la entrega en local**,
          # porque la ida y vuelta contra el Mailpit de Testcontainers los supera
          # en este equipo. El sintoma era el peor posible --"Mail server
          # connection failed" registrado y ningun correo, con la aplicacion
          # respondiendo 202 tan campante-- asi que el valor tiene que ser
          # holgado: esto es una red de seguridad contra un servidor colgado, no
          # un objetivo de latencia.
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000

  servlet:
    multipart:
      # El tope duro **antes de leer el cuerpo** (5.8.3, paso 1): una peticion
      # mayor la corta Tomcat y no llega al caso de uso.
      max-file-size: 25MB
      # Algo mas que el fichero: el `Content-Length` incluye la envoltura del
      # multipart --limites, cabeceras de parte-- y un fichero de exactamente
      # 25 MB pasaria del tope por unos cientos de bytes que no son suyos.
      max-request-size: 26MB
      # **Esta linea es la que hace posible reservar la cuota antes de
      # transmitir.** Sin ella, Spring parsea el multipart entero --y lo escribe
      # en disco-- antes de invocar al controlador, de modo que la reserva
      # ocurriria con los 25 MB ya recibidos y el bloqueo del hogar dejaria de
      # servir para lo que esta.
      resolve-lazily: true

server:
  servlet:
    context-path: /

drp:
  security:
    jwt:
      # Clave de firma HS256. Es un SECRETO DE DESPLIEGUE y no vive en el
      # repositorio: el valor de aqui solo sirve para desarrollo y para las
      # pruebas, y se sustituye por la variable de entorno al desplegar. El
      # arranque falla si no llega a 32 bytes, que es lo que HS256 exige.
      secret: ${DRP_JWT_SECRET:desarrollo-local-no-usar-en-produccion-32b+}
      # Corta porque un access token NO se puede revocar: sigue valiendo hasta
      # que caduca. Esa ventana es justo lo que acota su duracion.
      access-token-ttl: 15m
      # El refresh si es revocable --esta persistido y hasheado-- y rota en cada
      # uso.
      refresh-token-ttl: 30d
  rate-limit:
    # Limite de frecuencia de los endpoints sin autenticar (429 RATE_LIMITED).
    # Los valores son holgados para un hogar --nadie inicia sesion veinte veces
    # en cinco minutos-- y estrechos para quien enumera correos.
    window: 5m
    per-ip: 20
    # Mas bajo, y por otra razon: no es enumeracion sino inundacion del buzon de
    # una persona concreta. Cinco correos en cinco minutos ya es mas de lo que
    # nadie necesita.
    per-email: 5
    # Subidas por identidad y ventana. Holgado para quien esta inventariando la
    # casa a fotos, y suficiente para que llenar el gigabyte a base de peticiones
    # cueste horas en vez de minutos.
    per-identity-upload: 60

  storage:
    # La raiz del **volumen separado** de ficheros (5.8.1). En un despliegue de
    # verdad es un punto de montaje propio, con `noexec,nodev,nosuid` y fuera de
    # cualquier arbol que sirva el servidor web. En local basta un directorio.
    root: ${DRP_STORAGE_ROOT:./.data/files}
    # 1 GB por hogar. NO es un CHECK: no es una propiedad de una fila sino una
    # suma sobre las vivas, y se valida en el caso de uso con la fila del hogar
    # bloqueada (ADR-005).
    quota-bytes: 1073741824
    # 25 MB por fichero. Esto SI esta ademas en la tabla, y el contenedor de
    # servlets corta antes de llegar aqui.
    max-file-bytes: 26214400
    # El tope de pixeles, comprobado **antes** de decodificar. Un PNG de
    # 50 000 x 50 000 ocupa unos kilobytes comprimido y son diez gigabytes
    # abiertos: lo que hay que acotar no es el fichero sino la imagen.
    # 50 megapixeles admiten cualquier camara de movil actual con holgura.
    max-image-pixels: 50000000
    # El lado largo de la miniatura. De sobra para una rejilla en un movil de
    # 375 px, y no cuenta en la cuota del hogar.
    thumbnail-pixels: 320

  files:
    # De donde cuelgan las URL firmadas. En produccion es **otro dominio**, que
    # es lo que impide que un fichero que se cuele pese a todo comparta origen
    # con la sesion, el token y los datos del hogar. En local es la propia
    # aplicacion, que las sirve ella misma.
    base-url: ${DRP_FILES_BASE_URL:http://localhost:8080}
    # Secreto de la firma. Igual que la clave del JWT: es un SECRETO DE
    # DESPLIEGUE y lo comparten la aplicacion y nginx, que es quien la verifica.
    link-secret: ${DRP_FILES_LINK_SECRET:desarrollo-local-no-usar-en-produccion}
    # Con nginx delante, la descarga autorizada delega los bytes con
    # X-Accel-Redirect. Sin el, el mismo endpoint los transmite (5.8.4).
    #
    # La misma propiedad apaga el `location` /f/** que la aplicacion atiende en
    # desarrollo: dejarlo encendido con nginx delante seria una segunda puerta a
    # los bytes en el dominio de la aplicacion, que es justo lo que la ADR-005
    # separa.
    accel-redirect: ${DRP_FILES_ACCEL_REDIRECT:false}
    accel-prefix: /internal

  mail:
    # Remitente de los correos de enrolamiento (ADR-009).
    from: no-reply@drp.local
    # Base sobre la que se construyen los enlaces que viajan por correo. Apunta
    # al frontend, no a la API: quien recibe el correo abre una pantalla, no un
    # endpoint.
    base-url: http://localhost:5173
