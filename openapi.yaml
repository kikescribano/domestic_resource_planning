openapi: 3.0.3
info:
  title: DRP · Domestic Resource Planning API
  description: >
    API REST del core de DRP (Domestic Resource Planning).


    Este documento es la **fuente de verdad** de la API, no una ilustración
    de ella (ver ADR-007): se edita antes que el código que lo implementa, el
    frontend genera de él sus tipos y su cliente, y el backend se verifica
    contra él con las pruebas de contrato. Ver readme.md del proyecto para el
    contexto completo — modelo de dominio, event bus y roadmap.


    Dos convenciones transversales. Los **errores de forma** responden 400 con
    código `VALIDATION_ERROR`; los de **regla de negocio**, 409 con el código
    concreto. Y todas las colecciones se devuelven **paginadas**, con la misma
    envoltura `{ items, page, size, total }`.
  version: "0.3.0-fase2"
  license:
    name: Ver LICENSE del repositorio
servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local, levantado por compose.yaml
  - url: https://api.drp.example/api/v1
    description: Entorno ilustrativo (el real se fija al elegir el VPS, al cerrar la Fase 1)

tags:
  - name: households
    description: Alta de un hogar y de su primer administrador
  - name: auth
    description: Autenticación de usuarios del hogar
  - name: articles
    description: Catálogo de artículos del hogar (definición reutilizable, ver readme.md 4.1.1)
  - name: categories
    description: Catálogo de categorías del hogar (clasificación funcional, ver readme.md 4.1.1)
  - name: documents
    description: Documentación asociada a assets y artículos -- un enlace externo o un fichero subido
  - name: files
    description: Ficheros guardados en el servidor, con cuota de 1 GB por hogar (ver readme.md 5.8)
  - name: assets
    description: Gestión de recursos/assets
  - name: locations
    description: Gestión de ubicaciones
  - name: users
    description: Gestión de usuarios del hogar
  - name: invitations
    description: Invitaciones para sumar a alguien a un hogar
  - name: loans
    description: Préstamos (concepto mínimo del core, ver readme.md 4.1.5)
  - name: modules
    description: >
      Activación de módulos por hogar (ver ADR-010). Es la única familia de
      operaciones que no es del core: la sirve la plataforma, y es la que decide
      qué partes del sistema existen para un hogar.
  - name: notices
    description: >
      Avisos del hogar (ver ADR-011). También los sirve la plataforma, y también
      son de todos: aquí llegan los del core --un préstamo vencido-- y los que
      produce la regla de cada módulo. Los escribe el recorrido periódico, así
      que NO hay operación de crear ni de borrar: lo que una persona hace con un
      aviso es leerlo.
  - name: suppliers
    description: >
      Proveedores y contactos de servicio (Fase 2, Hito 2). Es el primer MÓDULO
      de verdad, así que todo lo que cuelga de /suppliers responde 403
      MODULE_INACTIVE mientras el hogar no lo tenga encendido -- que es una
      diferencia con el core y no un detalle: estas operaciones existen o no
      según lo que ese hogar haya decidido. Su ficha completa está en
      docs/backend/modules/suppliers.md.
  - name: warehouse
    description: >
      Almacén (Fase 2, Hito 3): qué hay, cuánto queda y cuándo se acaba o se
      estropea. Módulo, así que todo lo que cuelga de /warehouse responde 403
      MODULE_INACTIVE mientras el hogar no lo tenga encendido.


      LA FRONTERA CON EL CORE, que su ficha escribe sin ambigüedad: el core
      mantiene UN CONTADOR -- quantity, en la unit que pone el artículo -- y
      consumos, mínimos, caducidad y lotes son de este módulo. Warehouse no lleva
      un segundo contador: la quantity que devuelven sus operaciones sale de
      assets, y cambiarla es invocar al core (POST
      /warehouse/stock/{assetId}/consumptions acaba en un cambio de cantidad del
      core). Ficha completa en docs/backend/modules/warehouse.md.

  - name: purchasing
    description: >
      Compras y lista de la compra (Fase 2, Hito 4): qué falta, qué está pedido y
      qué ha entrado en casa. Módulo, así que todo lo que cuelga de /purchasing
      responde 403 MODULE_INACTIVE mientras el hogar no lo tenga encendido.


      LA FRONTERA CON WAREHOUSE, que su ficha escribe sin ambigüedad: WAREHOUSE
      DETECTA LA FALTA Y COMPRAS DECIDE QUÉ SE COMPRA Y CUÁNDO. Ninguna operación
      de aquí mira existencias ni mínimos. Con Warehouse apagado la lista deja de
      llenarse sola y se llena con POST /purchasing/list, que existe por eso.


      Y LA FRONTERA CON EL CORE: recibir una compra (POST
      /purchasing/purchases/{id}/receipt) acaba invocando la entrada de
      consumibles del core, que SUMA sobre la existencia de esa ubicación. Es el
      cierre del ciclo. Ficha completa en docs/backend/modules/purchasing.md.

  - name: maintenance
    description: >
      Mantenimiento (Fase 2, Hito 5): qué hay que revisar de las máquinas de la
      casa, cada cuánto, cuándo toca la próxima vez y qué se hizo la última.
      Módulo, así que todo lo que cuelga de /maintenance responde 403
      MODULE_INACTIVE mientras el hogar no lo tenga encendido.


      LA FRONTERA CONTRA EL PLANIFICADOR DE TAREAS, que su ficha escribe sin
      ambigüedad y POR ADELANTADO, porque ese módulo no existe todavía: DE CMMS ES
      EL CUÁNDO Y DEL PLANIFICADOR ES EL QUIÉN LO HACE. Un plan es una REGLA sobre
      una máquina --no tiene responsable, no tiene día y no se completa-- mientras
      que una tarea es un ENCARGO --tiene las tres cosas--. Por eso ninguna
      operación de aquí asigna nada a nadie y no hay ningún recurso que represente
      una ocurrencia futura: lo que hay es nextDueOn, UNA fecha por plan. El día
      que exista el planificador, lo que preguntará es GET /maintenance/plans con
      dueWithinDays, no una copia del calendario.


      Y LA FRONTERA CONTRA EL CORE: aquí SOLO SE LEE. Ninguna operación invoca un
      caso de uso del core ni escribe en sus tablas, al contrario que warehouse
      --que mueve un contador-- y purchasing --que crea existencias--. Ficha
      completa en docs/backend/modules/maintenance.md.

security:
  - bearerAuth: []

paths:
  /households:
    post:
      operationId: createHousehold
      tags: [households]
      summary: Crear un hogar con su primer administrador
      description: >
        Unica escritura sin autenticar de la API. Crea la identidad sin
        verificar, el hogar, la pertenencia HOUSEHOLD_ADMIN y las categorias
        por defecto en una transaccion, y envia por correo un token de
        verificacion de un solo uso. NO devuelve sesion -- el hogar no es
        utilizable hasta verificar. Responde siempre 202, exista o no ya ese
        correo: contestar otra cosa permitiria averiguar quien esta
        registrado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HouseholdInput" }
      responses:
        "202":
          description: Solicitud aceptada. Sin cuerpo, y siempre la misma respuesta.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/ServerError" }

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verificar el correo y obtener sesion
      description: >
        Consume el token de un solo uso enviado por correo, marca la identidad
        como verificada y devuelve el par de tokens. Si era el alta de un
        hogar, es aqui donde se publica HouseholdCreated -- no al insertar la
        fila, para que ningun modulo siembre datos de un hogar que quiza no
        llegue a usarse.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Correo verificado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "409":
          description: Token caducado, ya usado o inexistente (VERIFICATION_TOKEN_INVALID)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/ServerError" }

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Reenviar el enlace de verificacion
      description: >
        Invalida el token anterior y emite uno nuevo. Responde siempre igual,
        exista o no la identidad, por el mismo motivo que el alta de hogar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Solicitud aceptada. Sin cuerpo, y siempre la misma respuesta.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/ServerError" }

  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Solicitar el restablecimiento de contrasena
      description: >
        Sin credencial de ningun tipo. Si hay una identidad activa detras del
        correo, invalida su token de restablecimiento anterior, emite uno
        nuevo con una hora de caducidad y lo envia. Responde siempre 202,
        exista o no ese correo y este o no dada de baja la identidad:
        contestar otra cosa permitiria averiguar quien usa el sistema.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Solicitud aceptada. Sin cuerpo, y siempre la misma respuesta.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/ServerError" }

  /auth/password-reset/confirm:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Fijar la contrasena nueva con el token recibido
      description: >
        Consume el token de un solo uso, fija la contrasena y marca el correo
        como verificado si no lo estaba -- recibir el token prueba el control
        de la direccion. Revoca TODOS los refresh tokens de la identidad
        ANTES de emitir el par nuevo: si el motivo del restablecimiento era un
        acceso ajeno, dejar sesiones abiertas anularia el gesto.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword:
                  type: string
                  format: password
                  minLength: 12
      responses:
        "200":
          description: Contrasena restablecida; se devuelve sesion nueva
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "409":
          description: Token caducado, ya usado o inexistente (RESET_TOKEN_INVALID)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/ServerError" }

  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Cambiar la contrasena estando autenticado
      description: >
        Exige la contrasena actual ademas de la nueva: sin ese requisito, un
        access token robado bastaria para cambiarla y dejar fuera al dueno de
        la cuenta. Revoca las DEMAS sesiones y conserva la que esta en uso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword:
                  type: string
                  format: password
                  minLength: 12
      responses:
        "204":
          description: Contrasena cambiada
        "401":
          description: La contrasena actual no es correcta (CURRENT_PASSWORD_INVALID)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        default: { $ref: "#/components/responses/ServerError" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Iniciar sesión (usuarios del hogar)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password:
                  type: string
                  format: password
                  description: >
                    Sin minimo declarado a proposito: aqui se comprueba una
                    credencial existente, no se fija una nueva. Rechazarla por
                    forma daria 400 donde debe darse 401."
      responses:
        "200":
          description: Autenticación correcta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: >
            Credenciales inválidas, o correo sin verificar
            (EMAIL_NOT_VERIFIED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/ServerError" }

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Renovar el access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Nuevo par de tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Refresh token inválido o revocado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/ServerError" }

  /auth/logout:
    post:
      operationId: revokeSession
      tags: [auth]
      summary: Cerrar la sesión en curso
      description: >
        Revoca el refresh token indicado, que es lo único revocable: un access
        token no se puede retirar y sigue valiendo hasta que caduque, unos 15
        minutos. Para tumbar todas las sesiones a la vez está el cambio de
        contraseña. Responde igual con un token válido que con uno que ya no
        existe: no hay nada que averiguar por la respuesta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "204":
          description: Sesión cerrada
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: Listar las categorías del hogar
      parameters:
        - name: includeRetired
          in: query
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Listado de categorías vigentes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createCategory
      tags: [categories]
      summary: Crear una categoría
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Categoría creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "409":
          description: Ya existe una categoría vigente con ese name (CATEGORY_DUPLICATE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Renombrar o anotar una categoría
      description: >
        El nombre sigue siendo único entre las vigentes del hogar, comparado
        normalizado. Renombrar no toca a los assets ni a los artículos que la
        usan: la referencian por identificador, no por texto.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ya hay otra categoría vigente con ese nombre (CATEGORY_DUPLICATE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: retireCategory
      tags: [categories]
      summary: Retirar una categoría
      description: >
        Retirada lógica. Deja de ofrecerse al clasificar, pero los assets y
        artículos que ya la tenían la conservan, así que la fila permanece.
      responses:
        "204":
          description: Categoría retirada
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: Listar documentos del hogar
      parameters:
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - name: articleId
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/DocumentType" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Listado de documentos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    post:
      operationId: attachDocument
      tags: [documents]
      summary: Adjuntar un documento a un asset o a un artículo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "201":
          description: Documento adjuntado. Publica DocumentAttached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404":
          description: >
            El fileId no existe en este hogar. Responde 404 y no 403 a
            proposito: confirmar que existe delataria un fichero ajeno.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            No se indicó exactamente un destino -- asset o artículo, nunca
            ambos ni ninguno (DOCUMENT_TARGET_INVALID); no se indicó
            exactamente un contenido -- url o fileId (DOCUMENT_CONTENT_INVALID);
            o el fichero ya cuelga de otro sitio (FILE_ALREADY_ATTACHED), porque
            un fichero se adjunta una sola vez.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Eliminar un documento
      description: >
        Borrado real -- no lo referencia ninguna otra entidad. Si el documento
        tenia fichero, la misma transaccion lo marca para su retirada: la cuota
        se libera en el acto y los bytes los desenlaza el proceso diario.
      responses:
        "204":
          description: Documento eliminado
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /files:
    get:
      operationId: listFiles
      tags: [files]
      summary: Listar los ficheros del hogar
      description: >
        Ordenado por tamano DESCENDENTE, que es la pregunta real cuando la cuota
        se agota: que la esta ocupando. Excluye los borrados.
      parameters:
        - name: attached
          in: query
          schema: { type: boolean }
          description: >
            Con false devuelve los subidos y nunca adjuntados -- lo que se puede
            borrar sin perder nada.
        - name: type
          in: query
          schema:
            type: string
            enum: [image/jpeg, image/png, image/webp, application/pdf]
          description: >
            Filtra por tipo de contenido. Los mismos cuatro de la lista blanca
            de subida: no puede haber almacenado nada fuera de ellos.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Listado de ficheros
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredFilePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    post:
      operationId: uploadFile
      tags: [files]
      summary: Subir un fichero
      description: >
        Sube el contenido y devuelve sus metadatos. Adjuntarlo es un paso
        aparte -- POST /documents con fileId, o PATCH sobre el asset,
        articulo o ubicacion con photoFileId -- para que el frontend pueda
        subir mientras se rellena el formulario. Un fichero subido y nunca
        adjuntado ocupa cuota, y el proceso diario lo retira a las 24 h.
        El tipo se determina inspeccionando el contenido, no la extension ni
        el Content-Type declarado, y las imagenes se recodifican, lo que
        elimina los metadatos EXIF (ver readme.md 5.8.3).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Maximo 25 MB
      responses:
        "201":
          description: Fichero almacenado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredFile" }
        "409":
          description: >
            El hogar ha agotado su gigabyte (STORAGE_QUOTA_EXCEEDED). Se
            comprueba antes de recibir y otra vez mientras se recibe, asi que
            tambien puede responderse con la subida a medias.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: El fichero pasa de 25 MB (FILE_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: >
            El tipo real no esta en la lista blanca -- image/jpeg, image/png,
            image/webp o application/pdf (FILE_TYPE_NOT_ALLOWED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/ServerError" }

  /files/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getFile
      tags: [files]
      summary: Metadatos de un fichero
      responses:
        "200":
          description: Metadatos del fichero
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredFile" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Retirar un fichero
      description: >
        Solo sobre ficheros que no cuelgan de nada: primero se desadjunta.
        Marca la fila y libera la cuota; los bytes los desenlaza el proceso
        diario, lo que deja una ventana para deshacer un borrado equivocado.
      responses:
        "204":
          description: Fichero marcado para su retirada
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Un documento o una foto todavia lo referencian (FILE_IN_USE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /files/{id}/content:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadFile
      tags: [files]
      summary: Descargar el contenido de un fichero
      description: >
        Camino de los DOCUMENTOS y de cualquier descarga explicita: la
        aplicacion comprueba el hogar EN CADA PETICION y delega los bytes en el
        servidor web (ver readme.md 5.8.4). Una imagen no pasa por aqui para
        mostrarse -- se pinta con la url firmada que ya trae la entidad, porque
        un <img> no puede enviar la cabecera Authorization. Se sirve desde un
        dominio distinto al de la aplicacion y siempre como adjunto, lo que no
        impide que un <img> la pinte: el navegador solo honra
        Content-Disposition en navegaciones y descargas, no en subrecursos.
      responses:
        "200":
          description: Contenido del fichero
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Siempre attachment, con el nombre original codificado segun RFC 6266
            X-Content-Type-Options:
              schema: { type: string, example: nosniff }
            Content-Security-Policy:
              schema: { type: string, example: "default-src 'none'; sandbox" }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /storage:
    get:
      operationId: getStorageUsage
      tags: [files]
      summary: Uso de almacenamiento del hogar
      description: >
        Permite avisar antes de que una subida falle, en lugar de despues.
      responses:
        "200":
          description: Bytes ocupados y cuota
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageUsage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: Listar y buscar artículos del catálogo del hogar
      description: >
        Alimenta el autocompletado del alta de consumibles: se busca el artículo
        antes de dar entrada, para no volver a introducir su definición.
      parameters:
        - name: q
          in: query
          description: Búsqueda por name (normalizado, sin distinguir mayúsculas ni acentos)
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: barcode
          in: query
          schema: { type: string }
        - name: includeRetired
          in: query
          description: Por defecto false -- los artículos retirados no se ofrecen en el alta
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Listado de artículos vigentes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticlePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createArticle
      tags: [articles]
      summary: Crear un artículo en el catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleInput" }
      responses:
        "201":
          description: Artículo creado. Publica el evento ArticleCreated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "409":
          description: >
            Ya existe un artículo con ese name normalizado o ese código de
            barras en el hogar (ARTICLE_DUPLICATE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /articles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getArticle
      tags: [articles]
      summary: Detalle de un artículo
      responses:
        "200":
          description: Artículo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: updateArticle
      tags: [articles]
      summary: Corregir la ficha de un artículo
      description: >
        Cambia la definición, no las existencias. La unidad es el único campo
        que deja de poder cambiarse en cuanto el artículo tiene existencias
        vivas: alterarla reinterpretaría en silencio toda la cantidad ya
        contada, que se lleva en esa unidad.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticlePatch" }
      responses:
        "200":
          description: Artículo actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Ya hay otro artículo vigente con ese nombre o ese código de barras
            (ARTICLE_DUPLICATE), o se intenta cambiar la unidad de uno que ya
            tiene existencias (ARTICLE_UNIT_IMMUTABLE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: retireArticle
      tags: [articles]
      summary: Retirar un artículo del catálogo
      description: >
        Retirada lógica -- marca retiredAt. La fila permanece porque las
        existencias dadas de baja siguen apuntando a ella; borrarla rompería
        la clave ajena y el historial. Un artículo retirado no se ofrece en el
        alta ni admite nuevas entradas.
      responses:
        "204":
          description: Artículo retirado
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Al artículo aún le quedan existencias vivas
            (ARTICLE_HAS_EXISTENCES)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: Listar assets del hogar
      parameters:
        - $ref: "#/components/parameters/LocationIdFilter"
        - $ref: "#/components/parameters/ParentAssetIdFilter"
        - name: ownerId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AssetStatus" }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/AssetType" }
        - name: articleId
          in: query
          schema: { type: string, format: uuid }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: withoutOwner
          in: query
          description: Devuelve los assets huérfanos que dejó una baja de usuario
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: >
            Listado de assets. Excluye los DECOMMISSIONED salvo que se pidan con
            status=DECOMMISSIONED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createAsset
      tags: [assets]
      summary: Dar de alta un asset DURABLE
      description: >
        Solo admite assets DURABLE. La entrada de un CONSUMABLE se hace por
        POST /assets/intake, que resuelve el artículo y suma sobre la existencia
        que ya hubiera en esa ubicación.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetInput" }
      responses:
        "201":
          description: Asset creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "409":
          description: >
            La ubicación indicada no sirve como contenedor
            (ASSET_LOCATION_CONFLICT): solo un DURABLE puede alojar otros
            assets, porque una estantería contiene cosas y un paquete de harina
            no.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /assets/intake:
    post:
      operationId: registerConsumableIntake
      tags: [assets]
      summary: Dar entrada a un consumible
      description: >
        Registra la entrada de un CONSUMABLE. Se indica el artículo (existente
        por articleId, o nuevo mediante el objeto article), la ubicación
        y la cantidad, siempre en la unidad del artículo. Si ya existe una
        existencia de ese artículo en esa ubicación, la operación suma sobre
        ella y responde 200; si no, la crea y responde 201.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetIntakeInput" }
      responses:
        "200":
          description: >
            Existencia ya presente en esa ubicación: se sumó la cantidad.
            Publica AssetQuantityChanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "201":
          description: >
            Primera existencia de ese artículo en esa ubicación. Publica
            AssetCreated, y ArticleCreated si además creó el artículo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "409":
          description: >
            La ubicación no sirve como contenedor
            (ASSET_LOCATION_CONFLICT), cantidad no positiva
            (INTAKE_QUANTITY_NOT_POSITIVE) o artículo duplicado
            (ARTICLE_DUPLICATE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /assets/{id}:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: getAsset
      tags: [assets]
      summary: Detalle de un asset
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Modificar un asset (ubicación, asset padre o cantidad de un consumible)
      description: >
        La cantidad enviada aquí es absoluta -- sustituye, no suma (para sumar,
        POST /assets/intake). Ajustar cantidad sobre un asset CONSUMABLE publica
        el evento AssetQuantityChanged. El tipo del asset es inmutable; el
        articleId solo admite asignarse a un DURABLE que aún no tenga
        artículo, nunca cambiarse ni retirarse. No acepta estado: la baja se
        hace con DELETE, y LENT/AVAILABLE los gobiernan el préstamo y su
        devolución.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetPatch" }
      responses:
        "200":
          description: Asset actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "409":
          description: >
            La ubicación no sirve como contenedor (ASSET_LOCATION_CONFLICT),
            ciclo en la jerarquía (LOCATION_CYCLE), cantidad sobre un asset
            DURABLE (ASSET_QUANTITY_NOT_APPLICABLE), cantidad negativa
            (ASSET_QUANTITY_NEGATIVE) o mover una existencia a una ubicación
            que ya tiene otra viva del mismo artículo
            (EXISTENCE_ALREADY_IN_LOCATION), que se resuelve con
            POST /assets/{id}/merge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: decommissionAsset
      tags: [assets]
      summary: Dar de baja un asset
      description: >
        Baja lógica -- pasa el asset a estado DECOMMISSIONED, no borra la fila. Si es una
        existencia con cantidad pendiente, la baja la lleva a 0 y publica
        AssetQuantityChanged antes de AssetDeactivated: lo que quedaba se da
        por perdido. Una existencia dada de baja libera su hueco de artículo y
        ubicación, así que se puede volver a dar entrada allí.
      responses:
        "204":
          description: Asset dado de baja
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            El asset tiene hijos en la jerarquía (ASSET_HAS_CHILDREN) o un
            préstamo ACTIVE (ASSET_HAS_ACTIVE_LOAN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /assets/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    post:
      operationId: mergeStockItems
      tags: [assets]
      summary: Fusionar dos existencias del mismo artículo
      description: >
        Junta dos existencias CONSUMABLE del mismo artículo creadas por
        separado. El asset de la ruta es el que DESAPARECE: queda a cantidad 0
        y estado DECOMMISSIONED, y su cantidad se suma a la del destino, que conserva su
        ubicación y su propietario. Publica AssetQuantityChanged sobre el
        destino y AssetDeactivated sobre el origen, correlacionados por payload
        (mergedFromAssetId y mergedIntoAssetId).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetMergeInput" }
      responses:
        "200":
          description: Asset destino con la cantidad acumulada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Las dos existencias no son del mismo artículo
            (MERGE_ARTICLE_MISMATCH), origen y destino coinciden
            (MERGE_SAME_ASSET), alguna no es CONSUMABLE
            (MERGE_NOT_CONSUMABLE) o alguna está dada de baja
            (MERGE_ASSET_DEACTIVATED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /assets/{id}/children:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: listAssetChildren
      tags: [assets]
      summary: Hijos directos en la jerarquía de composición
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Listado de assets hijos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: Listar ubicaciones del hogar
      parameters:
        - name: parentLocationId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Listado de ubicaciones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createLocation
      tags: [locations]
      summary: Crear una ubicación
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationInput" }
      responses:
        "201":
          description: Ubicación creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "409":
          description: >
            Ya hay otra ubicación con ese nombre bajo el mismo padre
            (LOCATION_DUPLICATE). El nombre solo es único entre hermanas, no en
            todo el hogar: dos armarios pueden llamarse igual en cuartos
            distintos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /locations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getLocation
      tags: [locations]
      summary: Detalle de una ubicación
      responses:
        "200":
          description: Ubicación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Modificar una ubicación
      description: >
        Cambiar parentLocationId la mueve dentro de la jerarquía. Una ubicación
        no puede acabar siendo su propia antecesora, y eso lo comprueba el caso
        de uso: no hay forma de expresarlo en el esquema ni en la base de datos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationPatch" }
      responses:
        "200":
          description: Ubicación actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Ya hay otra ubicación con ese nombre bajo el mismo padre
            (LOCATION_DUPLICATE), o el movimiento crearía un ciclo
            (LOCATION_CYCLE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: deleteLocation
      tags: [locations]
      summary: Eliminar una ubicación
      description: >
        Borrado REAL, a diferencia de la baja de un asset o la retirada de un
        artículo: una ubicación vacía no deja historial que preservar. Por eso
        solo se puede eliminar si no le cuelga nada -- ni ubicaciones hijas ni
        assets dentro--, y hay que vaciarla antes a mano.
      responses:
        "204":
          description: Ubicación eliminada
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Tiene ubicaciones hijas (LOCATION_HAS_CHILDREN) o assets dentro
            (LOCATION_HAS_ASSETS)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /locations/{id}/children:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listLocationChildren
      tags: [locations]
      summary: Hijos directos en la jerarquía
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Listado de ubicaciones hijas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Listar miembros del hogar
      parameters:
        - name: includeDeactivated
          in: query
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Listado de usuarios activos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /users/me/avatar:
    put:
      operationId: setIdentityAvatar
      tags: [users]
      summary: Subir o sustituir el avatar propio
      description: >
        "me" resuelve a la IDENTIDAD del token, no a la pertenencia: el avatar
        es de la persona y sobrevive a cualquier hogar. Por eso NO es un fichero
        del hogar -- no suma a su gigabyte ni tiene politica de RLS detras (ver
        readme.md 4.1.1). Sustituye siempre al anterior, asi que no acumula.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Solo imagen, maximo 1 MB
      responses:
        "204":
          description: Avatar guardado
        "413":
          description: El fichero pasa de 1 MB (FILE_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: El tipo real no es una imagen admitida (FILE_TYPE_NOT_ALLOWED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: deleteIdentityAvatar
      tags: [users]
      summary: Quitar el avatar propio
      responses:
        "204":
          description: Avatar retirado
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /invitations:
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: Listar las invitaciones vivas (solo HOUSEHOLD_ADMIN)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Invitaciones ni aceptadas, ni revocadas, ni caducadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    post:
      operationId: inviteUser
      tags: [invitations]
      summary: Invitar a alguien al hogar (solo HOUSEHOLD_ADMIN)
      description: >
        Emite un token de un solo uso con 7 dias de caducidad y lo envia por
        correo. No crea identidad ni pertenencia: eso ocurre al aceptar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationInput" }
      responses:
        "201":
          description: Invitacion emitida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >
            Ya es miembro activo del hogar (ALREADY_MEMBER) o ya hay una
            invitacion viva para ese correo (INVITATION_ALREADY_PENDING)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Aceptar una invitacion
      description: >
        Sin autenticar -- lo autoriza el token recibido por correo. Crea la
        identidad ya VERIFICADA, porque haber recibido el token prueba el
        control de esa direccion, o vincula la que ya exista. name y password
        solo hacen falta si la identidad no existia.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationAcceptInput" }
      responses:
        "200":
          description: Invitacion aceptada; se devuelve sesion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "409":
          description: >
            Token caducado, ya usado o revocado (INVITATION_TOKEN_INVALID), o
            la identidad ya pertenece a otro hogar (IDENTITY_ALREADY_MEMBER)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/ServerError" }

  /invitations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeInvitation
      tags: [invitations]
      summary: Revocar una invitacion (solo HOUSEHOLD_ADMIN)
      responses:
        "204":
          description: Invitacion revocada
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deactivateUser
      tags: [users]
      summary: Dar de baja a un usuario del hogar (solo HOUSEHOLD_ADMIN)
      description: >
        Baja lógica -- marca deactivatedAt, revoca los refresh tokens del
        usuario e impide que vuelva a autenticarse. Sus assets quedan SIN
        PROPIETARIO, no se reasignan: se localizan después con
        GET /assets?withoutOwner=true. Sus préstamos se conservan. Publica
        UserDeactivated.
      responses:
        "204":
          description: Usuario dado de baja
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Es el único HOUSEHOLD_ADMIN activo del hogar
            (USER_LAST_ADMIN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /users/{id}/roles:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: changeUserRole
      tags: [users]
      summary: Modificar el rol estructural de un usuario (solo HOUSEHOLD_ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/UserRole" }
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Dejaría al hogar sin ningún HOUSEHOLD_ADMIN activo
            (USER_LAST_ADMIN). Un hogar sin administrador no puede invitar,
            cambiar roles ni dar de baja a nadie: quedaría bloqueado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /loans:
    post:
      operationId: startLoan
      tags: [loans]
      summary: Iniciar un préstamo
      description: >
        Solo un DURABLE puede prestarse, y solo si no tiene ya un préstamo
        abierto. OVERDUE cuenta como abierto: vencer no libera el asset.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoanInput" }
      responses:
        "201":
          description: Préstamo iniciado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "409":
          description: >
            El asset ya tiene un préstamo abierto -- ACTIVE o OVERDUE
            (LOAN_ASSET_ALREADY_LENT), o no es DURABLE
            (LOAN_ASSET_NOT_DURABLE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }
    get:
      operationId: listLoans
      tags: [loans]
      summary: Listar los préstamos del hogar
      description: >
        Solo para usuarios del hogar; un token acotado de préstamo no alcanza
        aquí, únicamente al préstamo concreto para el que se emitió.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, RETURNED, OVERDUE] }
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - name: open
          in: query
          description: Con true devuelve los abiertos, que son ACTIVE y OVERDUE juntos
          schema: { type: boolean }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Listado de préstamos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /loans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getLoan
      tags: [loans]
      summary: Consultar el estado de un préstamo
      security:
        - bearerAuth: []
        - loanToken: []
      responses:
        "200":
          description: >
            Estado del préstamo, en la forma que corresponde a la credencial:
            Loan con sesión del hogar y LoanExternalView con token acotado
            (ver readme.md, 5.4.3).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /loans/{id}/return:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: confirmReturn
      tags: [loans]
      summary: Confirmar la devolución de un préstamo
      security:
        - bearerAuth: []
        - loanToken: []
      responses:
        "200":
          description: >
            Préstamo devuelto, en la forma que corresponde a la credencial.
            Confirmar con token acotado devuelve la vista acotada: la
            devolución no ensancha lo que ese token puede ver.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: El préstamo ya estaba devuelto (LOAN_ALREADY_RETURNED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: Listar el catálogo de módulos con el estado del hogar
      description: >
        Devuelve el catálogo COMPLETO de lo que está desplegado, cada entrada
        con lo que este hogar ha decidido sobre ella. No se recorta por rol: ver
        que un módulo existe no es poder encenderlo --eso lo corta la
        autorización de las otras dos operaciones-- y quien no administra
        necesita saber que hay para poder pedirlo. Devolver dos catálogos según
        quién pregunte dejaría además al cliente sin poder distinguir "apagado"
        de "no me lo enseñan".


        La ausencia de decisión es INACTIVE: un hogar recién creado no tiene
        ninguna fila y todos sus módulos salen apagados. El cliente la resuelve
        UNA VEZ al arrancar la sesión, no una por pantalla.
      responses:
        "200":
          description: Catálogo de módulos con el estado del hogar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModulePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /modules/{key}/activation:
    parameters:
      - name: key
        in: path
        required: true
        description: Clave del módulo, en UPPER_SNAKE_CASE
        schema: { type: string, pattern: "^[A-Z][A-Z0-9_]*$", example: SUPPLIERS }
    post:
      operationId: activateModule
      tags: [modules]
      summary: Activar un módulo en el hogar
      description: >
        Solo HOUSEHOLD_ADMIN. Enciende el módulo y lo SIEMBRA desde el estado
        actual del core -- no reproduciendo eventos: la entrega del bus es
        at-least-once y en memoria, así que un módulo activado hoy no vio el
        AssetCreated de hace un mes y no hay dónde ir a buscarlo.


        Es idempotente: activar lo ya activo devuelve el mismo estado y NO
        vuelve a sembrar. La siembra corre dentro de la misma transacción, así
        que un fallo suyo deja el módulo apagado en lugar de encendido a medias.
      responses:
        "200":
          description: Módulo activo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdModule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: deactivateModule
      tags: [modules]
      summary: Desactivar un módulo en el hogar
      description: >
        Solo HOUSEHOLD_ADMIN. CONSERVA LOS DATOS Y LOS OCULTA: el módulo deja de
        publicar sus rutas --responden 403 MODULE_INACTIVE--, deja de atender
        eventos y desaparece de la navegación, y sus filas siguen donde estaban.
        Volver a activarlo las devuelve tal cual.


        Se descartó borrar al desactivar, que es destructivo e irreversible y
        obligaría a definir el borrado en cascada de cuatro módulos antes de
        escribir el primero; y se descartó bloquear la desactivación cuando hay
        datos, que convierte la activación en casi irreversible y castiga justo
        al hogar que probó el módulo.
      responses:
        "200":
          description: Módulo inactivo. Sus datos siguen guardados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdModule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }

  /notices:
    get:
      operationId: listNotices
      tags: [notices]
      summary: Listar los avisos del hogar
      description: >
        Del más reciente al más antiguo, que es como se lee una bandeja. Los
        avisos son DEL HOGAR y no de cada persona: un hogar es un grupo pequeño
        que comparte la bandeja igual que comparte el inventario, así que
        cualquiera de sus personas los ve y cualquiera puede marcarlos.


        Un aviso es EL TEXTO QUE SE ESCRIBIÓ ESE DÍA y no una vista de la fila
        que lo originó: si el préstamo se devuelve mañana, el aviso de que
        venció siguió siendo cierto. De ahí que no lleve referencia a nada, y de
        ahí que un aviso sobreviva a que su módulo se apague.
      parameters:
        - name: unreadOnly
          in: query
          required: false
          description: >
            Solo lo que falta por ver. La pantalla arranca aquí; sin el filtro
            tendría que traerse el histórico entero para tachar lo ya leído en
            el cliente.
          schema: { type: boolean, default: false }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Avisos del hogar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /notices/read:
    post:
      operationId: markAllNoticesRead
      tags: [notices]
      summary: Marcar como leídos todos los avisos del hogar
      description: >
        Vaciar la bandeja de una vez. Existe porque sin ella la única forma de
        dejar de ver lo pendiente es pulsar treinta veces, y lo que se hace
        entonces es dejar de mirar la bandeja.


        204 y sin cuerpo: lo que el cliente hace después es volver a leer la
        lista, no fiarse de lo que se le devolviera aquí.
      responses:
        "204": { description: No queda nada sin leer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/ServerError" }

  /notices/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: markNoticeRead
      tags: [notices]
      summary: Marcar un aviso como leído
      description: >
        Idempotente, y con una vuelta: volver a marcarlo NO mueve la fecha. Es
        deliberado -- readAt significa cuándo se vio POR PRIMERA VEZ, y si se
        moviera dejaría de poderse responder "esto lleva sin mirarse una
        semana".


        Marcar leído no borra nada: el aviso sigue en la bandeja completa y solo
        desaparece del filtro de no leídos.
      responses:
        "200":
          description: El aviso, con su fecha de lectura y quién lo leyó
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: Listar los contactos de servicio del hogar
      description: >
        Los vigentes primero y por nombre, que es como se busca un teléfono
        cuando algo se ha roto. Los retirados no salen salvo que se pidan.


        El filtro de texto mira EL NOMBRE y no los datos de contacto, y es una
        decisión de seguridad y no de comodidad: el teléfono y el correo del
        fontanero son datos personales de alguien que no es usuario del sistema,
        y un buscador por correo convertiría la lista en un directorio
        consultable. Compara sin distinguir mayúsculas ni acentos, igual que la
        unicidad del nombre.
      parameters:
        - name: serviceCategory
          in: query
          required: false
          description: Agrupa por oficio. Es la única agrupación que ofrece el módulo
          schema: { $ref: "#/components/schemas/ServiceCategory" }
        - name: q
          in: query
          required: false
          description: Busca en el nombre, normalizado
          schema: { type: string }
        - name: includeRetired
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Contactos de servicio del hogar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Dar de alta un contacto de servicio
      description: >
        El nombre es único ENTRE LOS VIGENTES del hogar, sin distinguir
        mayúsculas ni acentos: dos filas con el mismo teléfono son un duplicado
        que no se ve, y dos con el mismo nombre uno que se ve a la primera.


        Y hace falta AL MENOS UNA forma de contacto -- teléfono, correo o web.
        Los tres campos son opcionales uno a uno y obligatorios en conjunto, así
        que la regla responde 409 SUPPLIER_CONTACT_REQUIRED y no un 400: lo que
        falla no es la forma del cuerpo sino lo que ese contacto sería. La
        dirección postal no cuenta -- sirve para llegar, no para llamar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInput" }
      responses:
        "201":
          description: Contacto de servicio creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >
            Nombre repetido entre los vigentes (SUPPLIER_DUPLICATE) o sin
            ninguna forma de contacto (SUPPLIER_CONTACT_REQUIRED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }

  /suppliers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Ver un contacto de servicio con sus enlaces
      description: >
        Los enlaces vienen CON EL NOMBRE de aquello a lo que apuntan, resuelto
        contra el core al leer y no copiado: renombrar la caldera se ve aquí sin
        que nadie sincronice nada.
      responses:
        "200":
          description: El contacto y sus enlaces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Modificar un contacto de servicio
      description: >
        Modificación PARCIAL, con la misma semántica que el resto del contrato:
        un campo ausente no se toca y un campo presente a nulo se borra. La
        diferencia importa -- un PATCH que solo cambia el teléfono no puede
        vaciar las notas de paso.


        Sigue haciendo falta al menos una forma de contacto DESPUÉS del cambio:
        vaciar el único teléfono de alguien que no tiene correo responde 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierPatch" }
      responses:
        "200":
          description: Contacto de servicio actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Nombre repetido (SUPPLIER_DUPLICATE) o sin ninguna forma de contacto
            (SUPPLIER_CONTACT_REQUIRED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: retireSupplier
      tags: [suppliers]
      summary: Retirar un contacto de servicio
      description: >
        Retirada LÓGICA, igual que la de una categoría del core y por el mismo
        motivo: los enlaces lo referencian, así que borrar la fila rompería el
        historial de quién instaló la caldera. Deja de ofrecerse al enlazar,
        deja de salir en el listado por defecto, y sus enlaces se conservan.


        Es idempotente: retirar lo ya retirado devuelve 204 y NO mueve la fecha,
        que si no falsearía cuándo se dejó de llamar a esa gente.
      responses:
        "204": { description: Retirado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }

  /suppliers/{id}/links:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: linkSupplier
      tags: [suppliers]
      summary: Enlazar un contacto con un asset o una ubicación del core
      description: >
        El servicio técnico DE LA CALDERA, el taller DEL COCHE, el fontanero DEL
        PISO DE ARRIBA. Apunta a EXACTAMENTE UNA cosa: dar los dos
        identificadores o ninguno responde 409 SUPPLIER_LINK_TARGET_INVALID.


        El destino se resuelve contra el core antes de insertar, así que enlazar
        con algo de otro hogar responde 404 -- ni 403 ni un enlace que cuela: la
        comprobación de una clave ajena no pasa por RLS, y sin resolverlo antes
        una fila invisible se podría referenciar igual.


        Un contacto RETIRADO no admite enlaces nuevos (SUPPLIER_RETIRED). Los
        que ya tenía se conservan: la caldera la sigue habiendo instalado quien
        la instaló.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierLinkInput" }
      responses:
        "201":
          description: Enlace creado, con el nombre del destino resuelto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: >
            No existe el contacto, o no existe EN ESTE HOGAR aquello con lo que
            se quiere enlazar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            Ni uno ni los dos destinos (SUPPLIER_LINK_TARGET_INVALID), enlace ya
            existente (SUPPLIER_LINK_DUPLICATE) o contacto retirado
            (SUPPLIER_RETIRED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }

  /suppliers/{id}/links/{linkId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: linkId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: unlinkSupplier
      tags: [suppliers]
      summary: Deshacer un enlace
      description: >
        Borrado real: un enlace no deja historial que preservar. El contacto y
        el destino siguen donde estaban.


        El enlace va anidado bajo su contacto y eso se respeta: pedir el enlace
        de OTRO contacto responde 404 aunque ese enlace exista.
      responses:
        "204": { description: Enlace deshecho }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }

  /warehouse/stock:
    get:
      operationId: listWarehouseStock
      tags: [warehouse]
      summary: Las existencias que el almacén vigila
      description: >
        Las existencias vivas de CONSUMIBLE del hogar, con lo que Warehouse
        añade sobre cada una: su mínimo, si está por debajo, cuándo caduca lo
        más próximo y cuántos lotes tiene.


        La quantity que se devuelve es LA DEL CORE, leída de assets. Warehouse
        no lleva un segundo contador -- el core mantiene uno y este módulo
        guarda consumos, mínimos, caducidad y lotes. Que el cliente reciba una
        sola cifra es porque solo hay una, no porque se hayan reconciliado dos.


        belowMinimum y expiringWithinDays son las dos preguntas que este módulo
        existe para responder, así que se filtran en el servidor: hacerlo en el
        cliente obligaría a traerse la despensa entera para descartar casi todo.
      parameters:
        - name: q
          in: query
          required: false
          description: Busca en el nombre del artículo, normalizado (sin mayúsculas ni acentos)
          schema: { type: string }
        - name: locationId
          in: query
          required: false
          description: Solo lo que está en ese sitio del core
          schema: { type: string, format: uuid }
        - name: belowMinimum
          in: query
          required: false
          description: Solo lo que está en su mínimo o por debajo. Un artículo sin mínimo nunca aparece
          schema: { type: boolean, default: false }
        - name: expiringWithinDays
          in: query
          required: false
          description: Solo lo que tenga algún lote vivo que caduque dentro de tantos días
          schema: { type: integer, minimum: 0 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Existencias del hogar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/ServerError" }

  /warehouse/stock/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        description: El asset del CORE, no un identificador propio de Warehouse
        schema: { type: string, format: uuid }
    get:
      operationId: getWarehouseStockItem
      tags: [warehouse]
      summary: Una existencia con sus lotes y sus últimos movimientos
      description: >
        Devuelve además la antelación de aviso que le aplica, resuelta por la
        cadena sitio -> artículo -> siete días. El sitio manda sobre el artículo
        porque es lo que gobierna de verdad: el mismo yogur aguanta distinto
        dentro de la nevera que fuera.
      responses:
        "200":
          description: La existencia, con lo que Warehouse sabe de ella
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockItemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }

  /warehouse/stock/{assetId}/consumptions:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: recordStockConsumption
      tags: [warehouse]
      summary: Apuntar lo que se ha gastado
      description: >
        ES UN DELTA, no un absoluto, y esa es la diferencia entera con
        PATCH /assets/{id}, que sustituye la cantidad. La pregunta que se hace
        una persona en la cocina es "me he gastado 200 g", no "quedan 800":
        convertir una en la otra es de Warehouse, porque el core mantiene el
        contador y no tiene por qué saber de consumos.


        Responde 204 y no la existencia actualizada: el asiento del cuaderno lo
        escribe el manejador del evento que esto provoca, así que devolver aquí
        la existencia obligaría a leerla otra vez para incluir un cuaderno que
        puede estar escribiéndose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: number
                  exclusiveMinimum: true
                  minimum: 0
                  description: Lo consumido, en la unidad del artículo
      responses:
        "204": { description: Consumo apuntado }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >
            No es una existencia viva de consumible (STOCK_ITEM_NOT_TRACKED),
            lo consumido no es positivo (STOCK_CONSUMPTION_NOT_POSITIVE) o pasa
            de lo que hay (STOCK_CONSUMPTION_EXCEEDS_QUANTITY)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }

  /warehouse/movements:
    get:
      operationId: listStockMovements
      tags: [warehouse]
      summary: El cuaderno de movimientos
      description: >
        Un asiento por cada cambio de cantidad o de sitio de una existencia. NO
        SE MODIFICA NUNCA: se escribe y se queda, que es lo que lo convierte en
        un libro y no en una vista -- si el arroz se acaba mañana, el apunte de
        que ayer entraron 900 g siguió siendo cierto.


        Lo escribe siempre el manejador del evento del core y nunca una
        operación de Warehouse, que es lo que garantiza que un consumo apuntado
        desde el almacén y uno hecho con el PATCH del core produzcan el mismo
        asiento.
      parameters:
        - name: assetId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: articleId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Movimientos, de lo más reciente a lo más antiguo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMovementPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/ServerError" }

  /warehouse/lots:
    get:
      operationId: listStockLots
      tags: [warehouse]
      summary: Los lotes con caducidad
      description: >
        Los lotes vivos del hogar, del que antes caduca al que más tarda, que es
        el orden en que hay que mirarlos.


        Un lote responde a "de lo que hay, cuánto caduca cuándo", no a "cuánto
        hay": la suma de los lotes de una existencia puede quedarse por debajo de
        su cantidad, y eso es normal -- lo que no está en ningún lote es lo que
        nadie se molestó en fechar.
      parameters:
        - name: assetId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: includeConsumed
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Lotes del hogar, del que antes caduca al que más tarda
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockLotPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/ServerError" }
    post:
      operationId: registerStockLot
      tags: [warehouse]
      summary: Dar de alta un lote sobre una existencia
      description: >
        La cantidad de un lote es LA ÚNICA que Warehouse guarda, y no es un
        segundo contador: responde a otra pregunta -- de los 900 g que hay, 400
        son del lote que caduca en marzo.


        Los lotes de una existencia PUEDEN SUMAR MENOS que su cantidad, y es
        normal: lo que no está en ningún lote es lo que nadie se molestó en
        fechar. Lo que no pueden es pasarse (STOCK_LOT_EXCEEDS_QUANTITY), porque
        entonces el módulo estaría afirmando que hay más de lo que el core dice
        que hay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockLotInput" }
      responses:
        "201":
          description: Lote dado de alta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockLot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >
            No es una existencia viva de consumible (STOCK_ITEM_NOT_TRACKED),
            ya hay un lote vivo con ese código y esa fecha (STOCK_LOT_DUPLICATE)
            o los lotes sumarían más de lo que hay (STOCK_LOT_EXCEEDS_QUANTITY)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }

  /warehouse/lots/{lotId}:
    parameters:
      - name: lotId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateStockLot
      tags: [warehouse]
      summary: Corregir un lote
      description: >
        Semántica de PATCH del contrato: ausente no se toca, presente a nulo se
        borra. expiresOn y quantity no admiten nulo -- un lote sin fecha o sin
        cantidad no es un lote.


        Cambiar la fecha VUELVE A ARMAR EL AVISO: un lote que ya avisó con la
        fecha equivocada tiene que poder volver a avisar con la buena.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockLotPatch" }
      responses:
        "200":
          description: Lote corregido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockLot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Los lotes sumarían más de lo que hay (STOCK_LOT_EXCEEDS_QUANTITY)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: discardStockLot
      tags: [warehouse]
      summary: Dar el lote por consumido
      description: >
        NO TOCA EL CONTADOR DEL CORE, y esa distinción es de este módulo: marcar
        un lote dice "de lo que hay, esto ya no es de este lote", y gastarlo de
        verdad es POST /warehouse/stock/{assetId}/consumptions. Juntar las dos
        cosas obligaría a decidir si tirar un lote caducado descuenta o no, y esa
        pregunta de producto no la ha hecho nadie.


        Descartar dos veces no es un error: lo que el cliente pidió ya se
        cumple.
      responses:
        "204": { description: Lote dado por consumido }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }

  /warehouse/articles/{articleId}:
    parameters:
      - name: articleId
        in: path
        required: true
        description: El artículo del CORE. Warehouse no tiene artículos propios
        schema: { type: string, format: uuid }
    patch:
      operationId: updateWarehouseArticle
      tags: [warehouse]
      summary: Fijar el mínimo y la antelación de aviso de un artículo
      description: >
        Es un PATCH sobre un recurso que puede no existir todavía y QUE SE CREA
        AL TOCARLO: la ficha del módulo sobre un artículo no es algo que el
        usuario dé de alta, sino algo que existe en cuanto el artículo existe.
        De ahí que no haya un POST que la cree.


        minimumQuantity a nulo DEJA DE VIGILAR el artículo y limpia el estado que
        colgaba de él -- uno que ya no se vigila no puede quedarse marcado como
        bajo mínimos para siempre. expiryLeadDays a nulo no es cero: nulo
        significa "usa la del sitio, o la del módulo", y cero significa "avísame
        el mismo día".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarehouseArticlePatch" }
      responses:
        "200":
          description: La ficha del artículo en el almacén
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehouseArticle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }

  /warehouse/locations/{locationId}:
    parameters:
      - name: locationId
        in: path
        required: true
        description: La ubicación del CORE
        schema: { type: string, format: uuid }
    patch:
      operationId: updateWarehouseLocation
      tags: [warehouse]
      summary: La antelación de aviso de un sitio
      description: >
        "En la nevera avísame con tres días y en la despensa con treinta" es una
        regla DEL SITIO, y el core no tiene dónde ponerla: su Location describe
        el contenedor, no cómo se vigila lo que hay dentro. Manda sobre la del
        artículo porque es lo que gobierna de verdad.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarehouseLocationPatch" }
      responses:
        "200":
          description: La ficha del sitio en el almacén
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehouseLocation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }

  /purchasing/list:
    get:
      operationId: listShoppingList
      tags: [purchasing]
      summary: La lista de la compra del hogar
      description: >
        Lo que hace falta, ordenado por lo urgente que es la noticia: primero lo
        que se ha acabado (DEPLETED), luego lo que bajó del mínimo (LOW_STOCK) y
        por último lo que alguien apuntó a mano (MANUAL).


        Por omisión devuelve LAS DOS MITADES DE "me queda por comprar" -- lo que
        hace falta y lo que ya va en una compra abierta -- porque esa es una sola
        pregunta y no dos. Lo comprado y lo descartado se piden nombrándolos.


        El nombre, la unidad y packLabel salen del artículo del CORE y no se
        guardan en ninguna tabla de este módulo: una línea de texto suelto no los
        tiene y devuelve solo su nombre.
      parameters:
        - name: status
          in: query
          required: false
          description: Repetible. Omitido significa NEEDED e IN_PURCHASE
          schema:
            type: array
            items: { $ref: "#/components/schemas/ShoppingItemStatus" }
        - name: q
          in: query
          required: false
          description: Busca en el nombre del artículo o en el de la línea, normalizado
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: La lista de la compra
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/ServerError" }
    post:
      operationId: addShoppingListItem
      tags: [purchasing]
      summary: Apuntar algo en la lista
      description: >
        ES LA OPERACIÓN QUE HACE QUE LA LISTA SIRVA CON WAREHOUSE APAGADO, y por
        eso no es una comodidad sino parte de la frontera entre los dos módulos:
        sin Warehouse nadie detecta la falta, y una lista que solo se llenara sola
        estaría vacía en la mitad de los hogares.


        Una línea apunta a un ARTÍCULO del core O lleva un NOMBRE suelto, nunca
        las dos cosas y nunca ninguna. El nombre suelto -- "pilas AA" -- es un
        caso normal y no degradado; lo único que no puede hacer es dar entrada en
        el inventario al recibir la compra, porque inventarle una categoría y una
        unidad sería decidir por el hogar. Se le asigna un artículo con el PATCH
        cuando alguien quiera eso.


        La cantidad es OPCIONAL: "hace falta arroz" es una línea completa.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShoppingItemInput" }
      responses:
        "201":
          description: La línea recién apuntada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ese artículo ya está en la lista (SHOPPING_ITEM_DUPLICATE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }

  /purchasing/list/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateShoppingListItem
      tags: [purchasing]
      summary: Cambiar una línea de la lista
      description: >
        Misma semántica de PATCH que el resto del contrato: un campo ausente no se
        toca y un campo a nulo se borra. Aquí esa diferencia decide algo real --
        quantity a nulo deja la línea en "hace falta, sin decir cuánto".


        articleId SÍ se puede cambiar y NO se puede vaciar, y esa asimetría es
        deliberada: asignarle un artículo a una línea de texto suelto es la forma
        de que "pilas AA" acabe entrando en el inventario, mientras que quitárselo
        la dejaría sin nombre, porque el nombre es del artículo. Asignarlo borra
        el nombre suelto.


        Solo se cambian las líneas vivas: lo comprado o lo descartado responde 409
        SHOPPING_ITEM_NOT_PENDING.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShoppingItemPatch" }
      responses:
        "200":
          description: La línea actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            La línea ya no está viva (SHOPPING_ITEM_NOT_PENDING) o ese artículo ya
            está en la lista (SHOPPING_ITEM_DUPLICATE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: dismissShoppingListItem
      tags: [purchasing]
      summary: Descartar una línea sin comprarla
      description: >
        ES BAJA LÓGICA Y NO BORRADO, igual que la retirada de un contacto de
        servicio: que el hogar haya descartado "sal" tres veces es un dato sobre
        lo que no quiere comprar, y borrar la fila dejaría que el mismo evento de
        Warehouse la volviera a meter al minuto siguiente.


        Descartar dos veces no es un error. Lo que ya entró en casa no se
        descarta: responde 409 SHOPPING_ITEM_NOT_PENDING.
      responses:
        "204": { description: Descartada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Lo que ya se compró no se descarta (SHOPPING_ITEM_NOT_PENDING)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }

  /purchasing/purchases:
    get:
      operationId: listPurchases
      tags: [purchasing]
      summary: Las compras del hogar
      description: >
        De la más reciente a la más antigua. supplier es EL NOMBRE DE AQUEL DÍA,
        copiado al abrir la compra y no vuelto a mirar: una compra es historia, y
        además es lo único que se puede pintar cuando Proveedores está apagado.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/PurchaseStatus" }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Las compras del hogar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchasePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createPurchase
      tags: [purchasing]
      summary: Abrir una compra con lo que se lleva
      description: >
        Las líneas que se lleva pasan a IN_PURCHASE y dejan de ofrecerse para otra
        compra. Solo entran las que estén en NEEDED; si ninguna lo está, responde
        409 SHOPPING_ITEM_NOT_PENDING en lugar de robárselas a la compra en la que
        ya iban.


        supplierId es OPCIONAL y se valida contra Proveedores a través de un
        puerto de plataforma. Si ese módulo está apagado, o si ese identificador
        no existe, responde 409 PURCHASE_SUPPLIER_UNKNOWN -- Y NO DISTINGUE LOS
        DOS CASOS a propósito: distinguirlos obligaría a Compras a saber qué
        módulos tiene encendidos el hogar. UNA COMPRA SIN PROVEEDOR ES UNA COMPRA
        VÁLIDA ("fui al mercado"), que es lo que hace que la degradación no
        recorte ninguna funcionalidad.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseInput" }
      responses:
        "201":
          description: La compra abierta, con sus líneas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >
            Compra sin líneas (PURCHASE_EMPTY), ninguna línea disponible
            (SHOPPING_ITEM_NOT_PENDING) o no se puede leer el proveedor
            (PURCHASE_SUPPLIER_UNKNOWN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }

  /purchasing/purchases/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPurchase
      tags: [purchasing]
      summary: Una compra con sus líneas
      responses:
        "200":
          description: La compra y lo que lleva
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: cancelPurchase
      tags: [purchasing]
      summary: Anular una compra
      description: >
        SUS LÍNEAS VUELVEN A LA LISTA en NEEDED, que es lo único que puede pasar:
        lo que hacía falta sigue haciendo falta, y dejarlas colgando de una compra
        anulada las escondería sin que nadie hubiera decidido no comprarlas. Quien
        no las quiera las descarta, que es otra operación y otra intención.


        Anular dos veces no es un error. Una compra ya recibida responde 409
        PURCHASE_NOT_OPEN: lo que entró en casa no se deshace desde aquí.
      responses:
        "204": { description: "Anulada, y sus líneas de vuelta en la lista" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Esa compra ya se recibió (PURCHASE_NOT_OPEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }

  /purchasing/purchases/{id}/receipt:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: receivePurchase
      tags: [purchasing]
      summary: Recibir la compra -- el cierre del ciclo
      description: >
        LA COMPRA HA LLEGADO A CASA, y esto es lo que cierra el ciclo de la
        reposición: cada línea CON ARTÍCULO acaba invocando la entrada de
        consumibles del core, que SUMA sobre la existencia de esa ubicación en
        lugar de crear una segunda. Y como el core publica al hacerlo, recibir una
        compra deja además un asiento en el cuaderno de Warehouse si ese módulo
        está encendido -- sin que ninguno de los dos módulos sepa del otro.


        Es un sub-recurso con POST y no un PATCH de estado, por lo mismo que la
        activación de un módulo: recibir no es cambiar un campo sino un acto con
        su propio cuerpo.


        LOS TRES CAMPOS DE CADA LÍNEA SON OPCIONALES, y sus tres omisiones son la
        decisión de producto de este módulo: la lista dice "hace falta arroz" y no
        "de quién es y en qué balda va", así que eso se decide AL RECIBIR.
        quantity cae en la que la línea apuntaba; ownerId, en quien recibe la
        compra; y locationId, EN DONDE ESE ARTÍCULO YA VIVE si vive en un solo
        sitio -- lo último no es una comodidad, porque la entrada del core busca
        la existencia por artículo Y ubicación y sin eso la despensa acabaría con
        dos arroces.


        Una línea de TEXTO SUELTO se marca comprada y ahí acaba: no entra en el
        inventario. Si una línea con artículo no tiene cantidad ni la trae el
        cuerpo, responde 400 antes de dar ni una entrada -- el cierre no cabe en
        una transacción, así que un fallo a mitad no se puede deshacer y lo único
        que queda es no empezar.


        RECIBIR DOS VECES NO DA ENTRADA DOS VECES: cada línea se reclama con un
        cambio de estado condicional antes de darle entrada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiptInput" }
      responses:
        "200":
          description: La compra cerrada, con lo que acabó en cada existencia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Esa compra ya se cerró o se anuló (PURCHASE_NOT_OPEN) o no tiene nada
            que recibir (PURCHASE_EMPTY)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }

  /purchasing/suppliers:
    get:
      operationId: listPurchasingSuppliers
      tags: [purchasing]
      summary: Dónde se puede comprar
      description: >
        La vista de Compras sobre el dato maestro de Proveedores, leída por un
        puerto de plataforma y no por la API del otro módulo.


        CUELGA DE /purchasing Y NO DE /suppliers, y esa es la mitad visible de la
        decisión: un hogar con Compras encendido y Proveedores apagado recibe 200
        CON LA LISTA VACÍA en lugar del 403 MODULE_INACTIVE que le daría la ruta
        del otro módulo. Que la degradación sea del servidor y no del cliente es
        lo que impide que cada consumidor futuro tenga que acordarse de ella.


        Devuelve LO MÍNIMO que el puerto deja pasar -- quién es y cómo se llama --
        y ni teléfono ni correo: los datos personales de terceros se quedan en
        Proveedores. detail trae el IDENTIFICADOR de la categoría de servicio y no
        su rótulo, porque el texto que se lee en pantalla es un dato en castellano
        y lo pone el cliente.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Dónde se compra. Vacía si Proveedores está apagado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PurchasingSupplier" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/ServerError" }

  /maintenance/machines:
    get:
      operationId: listMaintenanceMachines
      tags: [maintenance]
      summary: Las máquinas que el módulo vigila
      description: >
        Los assets DURABLE vivos del hogar, con cuántos planes tienen y cuál es su
        próxima fecha prevista. Un consumible no aparece: un paquete de arroz no se
        revisa, y esa es la otra mitad de la frontera con warehouse -- allí los
        consumibles, aquí lo duradero, sin una sola fila en común.


        La ficha de cada máquina la abre el módulo solo: al sembrarse y al llegar
        AssetCreated. NO HAY OPERACIÓN DE CREARLA, y no es un olvido -- una máquina
        entra en el radar porque existe en el core, no porque alguien la dé de alta
        aquí.


        El nombre sale de assets --o de su artículo-- al leer, y no se guarda en
        ninguna tabla de este módulo.
      parameters:
        - name: q
          in: query
          required: false
          description: Busca en el nombre de la máquina, normalizado
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Las máquinas en mantenimiento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceMachinePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/ServerError" }

  /maintenance/machines/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        description: El identificador DEL ASSET, no el de la ficha -- la ficha no la crea nadie
        schema: { type: string, format: uuid }
    get:
      operationId: getMaintenanceMachine
      tags: [maintenance]
      summary: La ficha de una máquina, con sus planes y su historia reciente
      description: >
        Lo que cuelga de la máquina y no de ninguno de sus planes: su nota, su
        manual y el resumen de lo que se le ha hecho. Los planes vienen solo los
        vivos, y las intervenciones las diez últimas -- el histórico entero tiene
        su propia operación.


        El manual es un PUNTERO a un documento del core y no una copia: se abre y
        se descarga por /documents, que es de quien es.
      responses:
        "200":
          description: La ficha de la máquina
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceMachineDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: updateMaintenanceMachine
      tags: [maintenance]
      summary: La nota de una máquina y cuál de sus documentos es su manual
      description: >
        Misma semántica de PATCH que el resto del contrato: un campo ausente no se
        toca y un campo a nulo se borra.


        manualDocumentId EXISTE POR UN MOTIVO QUE SE OLVIDA: el handler de
        DocumentAttached deja apuntado EL ÚLTIMO manual adjuntado, que es la
        semántica normal de un manual de referencia pero puede no ser el bueno
        --alguien sube el manual de otro modelo--. Sin esta operación esa elección
        no tendría corrección posible desde la pantalla. El documento tiene que
        colgar de ESTA máquina; si no, responde 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceMachinePatch" }
      responses:
        "200":
          description: La ficha actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceMachineDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }

  /maintenance/plans:
    get:
      operationId: listMaintenancePlans
      tags: [maintenance]
      summary: Los planes de mantenimiento del hogar
      description: >
        Ordenados por la próxima fecha prevista, que es la pregunta que se hace
        quien entra: qué toca antes.


        dueWithinDays ES LO QUE EL PLANIFICADOR DE TAREAS PREGUNTARÁ EL DÍA QUE
        EXISTA, en lugar de copiarse el calendario de este módulo. Va como filtro
        del servidor y no de la pantalla por eso, además de por lo obvio: filtrarlo
        en el cliente obligaría a traerse los planes del hogar entero.


        Por omisión solo los vivos. Un plan cancelado conserva su histórico y se
        pide nombrándolo.
      parameters:
        - name: assetId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: false
          description: Busca en el nombre del plan, normalizado
          schema: { type: string }
        - name: dueWithinDays
          in: query
          required: false
          description: >
            Solo los que tocan dentro de N días. NO PONE SUELO: lo que ya se pasó
            sigue apareciendo, que es justo lo que hay que decir
          schema: { type: integer, minimum: 0 }
        - name: includeCancelled
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Los planes de mantenimiento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenancePlanPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/ServerError" }
    post:
      operationId: createMaintenancePlan
      tags: [maintenance]
      summary: Crear un plan de mantenimiento
      description: >
        UN PLAN CUELGA DE UN ASSET DURABLE VIVO. Ni de un consumible --que no se
        revisa-- ni de uno dado de baja: 409 MAINTENANCE_ASSET_NOT_ELIGIBLE.


        EL PERIODO VA EN MESES Y NO EN DÍAS, y no es comodidad: sumar meses conserva
        el día del mes, mientras que una revisión anual de 365 días se desplaza un
        día cada año bisiesto y a los veinte años cae en una fecha que nadie eligió.


        leadDays es opcional y cae en QUINCE. Lo que no cabe es una antelación más
        larga que el propio periodo, que dejaría el plan permanentemente a punto de
        tocar: 409 MAINTENANCE_LEAD_EXCEEDS_INTERVAL.


        supplierId ES OPCIONAL Y SE GUARDA SIN SU NOMBRE, al revés que en una
        intervención: un plan es una REGLA VIVA y tiene que decir el nombre de hoy
        --a esa persona es a quien hay que llamar el mes que viene--, así que se
        resuelve al leer por el puerto de plataforma. Si no se puede leer --no
        existe, o Proveedores está apagado-- responde 409
        MAINTENANCE_SUPPLIER_UNKNOWN y no distingue los dos casos, por lo mismo que
        purchasing: distinguirlos obligaría a este módulo a saber qué módulos tiene
        encendidos el hogar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenancePlanInput" }
      responses:
        "201":
          description: El plan recién creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenancePlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >
            El asset no es una máquina viva (MAINTENANCE_ASSET_NOT_ELIGIBLE); ya hay
            un plan vivo con ese nombre en esa máquina
            (MAINTENANCE_PLAN_DUPLICATE); la antelación no cabe en el periodo
            (MAINTENANCE_LEAD_EXCEEDS_INTERVAL); o no se puede leer ese servicio
            técnico (MAINTENANCE_SUPPLIER_UNKNOWN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }

  /maintenance/plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getMaintenancePlan
      tags: [maintenance]
      summary: Un plan con su máquina, su servicio técnico y su historia
      description: >
        supplier viene RESUELTO AL LEER por el puerto de plataforma, no copiado. Es
        lo que hace que un contacto RETIRADO siga siendo legible -- la garantía que
        la ficha de Proveedores declaró por adelantado y para este caso exacto: un
        plan que apunte a quien ya no se llama tiene que poder decir a quién
        apuntaba. Nulo si no hay, si ya no existe o si Proveedores está apagado, sin
        que el cliente pueda ni deba distinguir los tres casos.


        El estado del aviso --en qué fase avisó y para qué fecha-- NO SALE AQUÍ: es
        el estado interno con el que el módulo se acuerda de no repetirse, no algo
        sobre lo que el cliente decida nada.
      responses:
        "200":
          description: El plan con su detalle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenancePlanDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }
    patch:
      operationId: updateMaintenancePlan
      tags: [maintenance]
      summary: Cambiar un plan
      description: >
        Misma semántica de PATCH que el resto del contrato, con una asimetría
        deliberada: intervalMonths y nextDueOn SE PUEDEN CAMBIAR Y NO SE PUEDEN
        VACIAR --un plan sin cada-cuánto o sin próxima fecha no es un plan--
        mientras que supplierId SÍ se puede vaciar, porque dejar de llamar a nadie
        es una decisión legítima.


        MOVER LA FECHA REARMA EL AVISO, y no hay ningún campo que lo pida: el estado
        del aviso cuelga de la próxima fecha prevista, así que en cuanto cambia deja
        de valer sola. Es lo que impide que un camino se olvide de limpiarla y deje
        un plan que no vuelve a avisar nunca.


        Un plan cancelado no se modifica: 409 MAINTENANCE_PLAN_CANCELLED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenancePlanPatch" }
      responses:
        "200":
          description: El plan actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenancePlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            El plan está cancelado (MAINTENANCE_PLAN_CANCELLED); ya hay otro vivo
            con ese nombre en esa máquina (MAINTENANCE_PLAN_DUPLICATE); la
            antelación no cabe en el periodo (MAINTENANCE_LEAD_EXCEEDS_INTERVAL); o
            no se puede leer ese servicio técnico (MAINTENANCE_SUPPLIER_UNKNOWN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }
    delete:
      operationId: cancelMaintenancePlan
      tags: [maintenance]
      summary: Cancelar un plan
      description: >
        ES BAJA LÓGICA Y NO BORRADO, igual que la retirada de un contacto de
        servicio: el plan deja de vigilarse y CONSERVA SU HISTÓRICO -- que la
        caldera se revisó tres veces siguió siendo cierto después de tirarla.


        Cancelar dos veces no es un error. Y cancelar LIBERA SU NOMBRE, porque el
        índice de nombre único es parcial: volver a crear el mismo plan es la salida
        que este contrato deja para reactivarlo.
      responses:
        "204": { description: Plan cancelado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/ServerError" }

  /maintenance/interventions:
    get:
      operationId: listMaintenanceInterventions
      tags: [maintenance]
      summary: El histórico de intervenciones
      description: >
        De la más reciente a la más antigua. Es un LIBRO: se escribe y no se toca,
        así que no hay operación de modificar ni de borrar.
      parameters:
        - name: assetId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: planId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: El histórico
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceInterventionPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/ServerError" }
    post:
      operationId: registerMaintenanceIntervention
      tags: [maintenance]
      summary: Registrar lo que se hizo
      description: >
        ES LO QUE REARMA EL CICLO, y la operación por la que existe este módulo. Si
        la intervención cumple un plan, LE AVANZA LA PRÓXIMA FECHA y con ello vuelve
        a armar su aviso.


        LA PRÓXIMA SE CUENTA DESDE LO QUE SE HIZO Y NO DESDE LA QUE TOCABA: si la
        revisión anual se hizo con dos meses de retraso, la siguiente es un año
        después de la real. Contarla desde la teórica arrastraría el retraso para
        siempre y acabaría pidiendo dos revisiones el mismo año.


        planId ES OPCIONAL: una correctiva nunca cuelga de un plan, y una preventiva
        puede no colgar tampoco --cambiar el filtro sin tener plan escrito es un
        caso normal, y exigirlo obligaría a inventarse un plan para poder apuntar
        algo ya hecho.


        supplierId SE GUARDA CON SU NOMBRE COPIADO, al revés que en un plan: una
        intervención es HISTORIA, y que aquel día vino aquel servicio técnico siguió
        siendo cierto aunque después se retire o el hogar apague Proveedores.


        Una intervención NO PUEDE SER DEL FUTURO: adelantaría la fecha sobre algo
        que no ha pasado (400).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceInterventionInput" }
      responses:
        "201":
          description: Lo que se acaba de apuntar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceIntervention" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            El asset no es una máquina viva (MAINTENANCE_ASSET_NOT_ELIGIBLE); el
            plan está cancelado (MAINTENANCE_PLAN_CANCELLED); o no se puede leer ese
            servicio técnico (MAINTENANCE_SUPPLIER_UNKNOWN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ServerError" }

  /maintenance/suppliers:
    get:
      operationId: listMaintenanceSuppliers
      tags: [maintenance]
      summary: A quién se puede llamar
      description: >
        La vista de CMMS sobre el dato maestro de Proveedores, leída por un puerto
        de plataforma y no por la API del otro módulo. Es la misma operación que
        purchasing publica sobre su propio prefijo, y por el mismo motivo: CUELGA DE
        /maintenance Y NO DE /suppliers, así que un hogar con Mantenimiento
        encendido y Proveedores apagado recibe 200 CON LA LISTA VACÍA en lugar del
        403 MODULE_INACTIVE que le daría la ruta del otro módulo.


        NO FILTRA POR CATEGORÍA, y esa es la decisión de este hito como SEGUNDO
        consumidor del puerto: de las catorce categorías de Proveedores casi todas
        son servicios técnicos --fontanería, electricidad, calderas,
        electrodomésticos, carpintería, cerrajería, vehículo...-- así que recortar
        la lista escondería justo al contacto que hace falta. Lo que sí hacía falta
        --distinguirlos de un vistazo-- ya cabe en detail, con el que el cliente
        AGRUPA el selector. Ensanchar el puerto habría hecho que plataforma
        aprendiera qué es una categoría de servicio y cuáles son válidas.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A quién se llama. Vacía si Proveedores está apagado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaintenanceSupplier" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT de usuarios del hogar. Claims -- sub (identityId), memberId
        (pertenencia en el hogar), householdId, role y sid. La distincion entre
        sub y memberId importa: todo lo que el dominio llama "usuario"
        --propietario de un asset, prestador, receptor, createdBy-- apunta a la
        pertenencia, mientras que los refresh tokens cuelgan de la identidad.


        sid identifica cual de las sesiones de esa persona es esta: es el
        identificador del refresh token con el que se emitio. Existe porque
        POST /auth/password revoca las DEMAS sesiones y conserva la que esta en
        uso, y para conservarla hay que saber cual es. La alternativa era pedir
        el refresh token en el cuerpo de esa operacion, que obligaria al cliente
        a mandar una credencial de vida larga donde no hace falta. No es un
        secreto: identifica una fila cuyo valor real esta hasheado.
    loanToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Credencial de un prestador o receptor **externo**, sin cuenta en DRP.
        Es un JWT firmado **sin sub de usuario**, con claims loanId y role
        (LENDER | BORROWER), que viaja como enlace por correo al iniciar el
        prestamo.


        Su alcance son exactamente dos operaciones -- GET /loans/{id} de ESE
        prestamo y POST /loans/{id}/return -- y ninguna otra cosa del hogar.
        Ni el listado, ni otro prestamo, ni los assets.


        Vale a la vez la firma y la fila: su hash se guarda en
        loan_access_tokens, y verificarlo exige firma valida **y** fila viva.
        Las dos capas hacen cosas distintas y por eso estan las dos -- la firma
        lo hace infalsificable y deja rechazar lo caducado sin tocar la base de
        datos; la fila lo hace **revocable**, que un JWT por si solo no puede
        ser, y aqui hace falta porque este token no es de vida corta: un
        prestamo OVERDUE puede durar meses.

  parameters:
    AssetId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationIdFilter:
      name: locationId
      in: query
      schema: { type: string, format: uuid }
    ParentAssetIdFilter:
      name: parentAssetId
      in: query
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Pagina solicitada, empezando en 0
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Elementos por pagina
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: No autorizado para esta operación
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Falta el token, ha caducado o no es válido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: >
        El cuerpo o los parámetros no cumplen el contrato (VALIDATION_ERROR).
        Es el error de forma; los de negocio van en 409. `details` lleva un
        campo por atributo rechazado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: >
        Se ha superado el límite de frecuencia (RATE_LIMITED). Se aplica sobre
        los endpoints sin autenticar y sobre la subida de ficheros.
      headers:
        Retry-After:
          description: Segundos que conviene esperar antes de reintentar
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: >
        Error no previsto (INTERNAL_ERROR). El cuerpo nunca lleva detalle
        interno: la traza va al log, no a la respuesta.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      description: >
        Forma única de todo error de la API. `code` es lo que el cliente trata;
        `message` es texto para diagnóstico, no para mostrar tal cual.
      properties:
        code:
          type: string
          example: ASSET_LOCATION_CONFLICT
          description: >
            Enumerado a propósito: el cliente decide qué hacer por el código, y
            un código que no esté aquí es un fallo del contrato, no un caso que
            el frontend deba adivinar.
          enum:
            - ALREADY_MEMBER
            - ARTICLE_DUPLICATE
            - ARTICLE_HAS_EXISTENCES
            - ARTICLE_UNIT_IMMUTABLE
            - ASSET_HAS_ACTIVE_LOAN
            - ASSET_HAS_CHILDREN
            - ASSET_LOCATION_CONFLICT
            - ASSET_QUANTITY_NEGATIVE
            - ASSET_QUANTITY_NOT_APPLICABLE
            - CATEGORY_DUPLICATE
            - CURRENT_PASSWORD_INVALID
            - DOCUMENT_CONTENT_INVALID
            - DOCUMENT_TARGET_INVALID
            - EMAIL_NOT_VERIFIED
            - EXISTENCE_ALREADY_IN_LOCATION
            - FILE_ALREADY_ATTACHED
            - FILE_IN_USE
            - FILE_TOO_LARGE
            - FILE_TYPE_NOT_ALLOWED
            - IDENTITY_ALREADY_MEMBER
            - INTAKE_QUANTITY_NOT_POSITIVE
            - INTERNAL_ERROR
            - INVITATION_ALREADY_PENDING
            - INVITATION_TOKEN_INVALID
            - LOAN_ALREADY_RETURNED
            - LOAN_ASSET_ALREADY_LENT
            - LOAN_ASSET_NOT_DURABLE
            - LOCATION_CYCLE
            - LOCATION_DUPLICATE
            - LOCATION_HAS_ASSETS
            - LOCATION_HAS_CHILDREN
            - MAINTENANCE_ASSET_NOT_ELIGIBLE
            - MAINTENANCE_LEAD_EXCEEDS_INTERVAL
            - MAINTENANCE_PLAN_CANCELLED
            - MAINTENANCE_PLAN_DUPLICATE
            - MAINTENANCE_SUPPLIER_UNKNOWN
            - MERGE_ARTICLE_MISMATCH
            - MERGE_ASSET_DEACTIVATED
            - MERGE_NOT_CONSUMABLE
            - MERGE_SAME_ASSET
            - MODULE_INACTIVE
            - PURCHASE_EMPTY
            - PURCHASE_NOT_OPEN
            - PURCHASE_SUPPLIER_UNKNOWN
            - RATE_LIMITED
            - RESET_TOKEN_INVALID
            - SHOPPING_ITEM_DUPLICATE
            - SHOPPING_ITEM_NOT_PENDING
            - STOCK_CONSUMPTION_EXCEEDS_QUANTITY
            - STOCK_CONSUMPTION_NOT_POSITIVE
            - STOCK_ITEM_NOT_TRACKED
            - STOCK_LOT_DUPLICATE
            - STOCK_LOT_EXCEEDS_QUANTITY
            - STORAGE_QUOTA_EXCEEDED
            - SUPPLIER_CONTACT_REQUIRED
            - SUPPLIER_DUPLICATE
            - SUPPLIER_LINK_DUPLICATE
            - SUPPLIER_LINK_TARGET_INVALID
            - SUPPLIER_RETIRED
            - USER_LAST_ADMIN
            - VALIDATION_ERROR
            - VERIFICATION_TOKEN_INVALID
        message: { type: string }
        details:
          type: object
          description: Contexto adicional del error; su forma depende del código

    HouseholdModule:
      type: object
      required: [key, name, description, routePrefix, status]
      description: >
        Una entrada del catálogo con lo que este hogar ha decidido sobre ella.


        La clave, el nombre, la descripción y el prefijo de ruta NO se guardan
        por hogar: viven en el registro en código, que es donde está también lo
        que se despliega. Lo único que es del hogar es el estado y sus fechas.
      properties:
        key:
          type: string
          example: SUPPLIERS
          description: >
            Identificador del módulo, en inglés y en UPPER_SNAKE_CASE porque es
            un identificador y no un dato.
        name:
          type: string
          example: Proveedores y contactos de servicio
          description: Lo que ve el usuario. Es un dato, así que va en castellano.
        description: { type: string }
        routePrefix:
          type: string
          example: /api/v1/suppliers
          description: >
            Prefijo bajo el que el módulo publica sus operaciones. Todo lo que
            cuelga de él responde 403 MODULE_INACTIVE mientras esté apagado,
            exista o no todavía un controlador que lo atienda.
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          description: >
            Sin decisión tomada el estado es INACTIVE. Para el cliente son el
            mismo caso, así que la respuesta no distingue "nunca se encendió" de
            "se apagó".
        activatedAt:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se encendió por última vez
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se apagó por última vez

    PageMeta:
      type: object
      required: [page, size, total]
      description: >
        Metadatos de paginación, comunes a todas las colecciones. Son las mismas
        en las doce sin excepción por tamaño esperado: una sola forma que
        aprender en el cliente, y ninguna migración el día que una lista que se
        creía pequeña deje de serlo.
      properties:
        page: { type: integer, minimum: 0, example: 0, description: "Página devuelta, empezando en 0" }
        size: { type: integer, minimum: 1, example: 50, description: Tamaño de página aplicado }
        total: { type: integer, format: int64, example: 137, description: Total de elementos que cumplen el filtro }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 900 }

    Authorship:
      type: object
      description: >
        Autoria de la fila, solo lectura. Se toma del token de quien hace la
        peticion y se ignora si el cliente la envia. Nulo significa que el
        cambio lo hizo el sistema y no una persona -- el caso del proceso
        diario de prestamos vencidos.
      properties:
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }

    HouseholdInput:
      type: object
      required: [name, timeZone, admin]
      properties:
        name: { type: string }
        timeZone:
          type: string
          example: Europe/Madrid
          description: Identificador IANA. Lo usa el proceso diario de vencidos
        admin:
          type: object
          required: [name, email, password]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            password:
              type: string
              format: password
              minLength: 12

    UserRole:
      type: string
      enum: [HOUSEHOLD_ADMIN, HOUSEHOLD_MEMBER]

    AssetStatus:
      type: string
      enum: [AVAILABLE, LENT, DECOMMISSIONED]

    AssetType:
      type: string
      description: >
        Naturaleza del asset. DURABLE tiene identidad propia y se cuenta por
        unidad física; CONSUMABLE se agota o se repone y es una existencia de un
        artículo, con cantidad en la unidad de ese artículo. Se fija en el alta
        y es inmutable después.
      enum: [DURABLE, CONSUMABLE]

    MeasurementUnit:
      type: string
      description: >
        Unidad de medida de un artículo del catálogo. La fija el artículo, no la
        existencia: todas las existencias de un mismo artículo se llevan en ella.
      enum: [UNIT, GRAM, KILOGRAM, MILLILITER, LITER, METER, PACK]

    CategoryInput:
      type: object
      description: >
        Clasificación funcional del hogar. Cada hogar arranca con un juego
        sembrado y lo edita a su gusto.
      required: [name]
      properties:
        name:
          type: string
          description: Único entre las categorías vigentes del hogar, comparado normalizado
        notes: { type: string }

    Category:
      allOf:
        - $ref: "#/components/schemas/CategoryInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            retiredAt:
              type: string
              format: date-time
              nullable: true
              description: Informado si la categoría está retirada
        - $ref: "#/components/schemas/Authorship"

    DocumentType:
      type: string
      enum: [INVOICE, WARRANTY, MANUAL, OTHER]

    DocumentInput:
      type: object
      description: >
        Documento asociado. Cuelga de exactamente uno de assetId o articleId
        -- factura y garantía son de la unidad física, el manual es del
        modelo -- y su contenido es exactamente uno de url o fileId: un
        enlace a donde ya vivía, o un fichero subido al servidor.
      required: [type]
      properties:
        assetId: { type: string, format: uuid }
        articleId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/DocumentType" }
        url:
          type: string
          format: uri
          description: Cuando el documento vive fuera. Excluyente con fileId
        fileId:
          type: string
          format: uuid
          description: >
            Cuando el documento se subió al servidor. Excluyente con url. Debe
            ser un fichero del mismo hogar y que no cuelgue ya de ningún sitio.
        description: { type: string }
        date:
          type: string
          format: date
          description: Cuándo se emitió -- la fecha de la factura o de la garantía
        validUntil:
          type: string
          format: date
          description: Cuándo deja de valer. En una garantía es el dato que importa
      # Las dos exclusiones que la prosa describe, ahora expresadas: un validador
      # de esquema las ve, y hasta ahora no.
      allOf:
        - oneOf:
            - required: [assetId]
            - required: [articleId]
        - oneOf:
            - required: [url]
            - required: [fileId]

    Document:
      allOf:
        - $ref: "#/components/schemas/DocumentInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
        - $ref: "#/components/schemas/Authorship"

    StoredFile:
      type: object
      description: >
        Fichero guardado en el servidor. No es un asset -- no ocupa sitio en el
        hogar, no se clasifica ni se presta. Es inmutable: cambiar una foto es
        subir otra y apuntar a ella, no editar la que habia.
      properties:
        id: { type: string, format: uuid }
        originalName:
          type: string
          description: >
            El nombre con el que llego, saneado. Es solo un dato: nunca forma
            parte de la ruta en disco.
        contentType:
          type: string
          description: El tipo DETECTADO al inspeccionar el contenido, no el declarado
          enum: [image/jpeg, image/png, image/webp, application/pdf]
        sizeBytes:
          type: integer
          format: int64
          description: >
            Tamano del fichero ya almacenado -- si era una imagen, despues de
            recodificarla. Es lo que suma la cuota del hogar.
        checksum:
          type: string
          description: SHA-256 del contenido, en hexadecimal
        url:
          type: string
          format: uri
          description: >
            URL FIRMADA de vida corta, servida desde el dominio de ficheros.
            Caduca con el access token que la genero -- unos 15 minutos -- y NO
            debe guardarse en el estado del cliente ni compartirse: vale para
            pintar ahora (ver readme.md 5.8.4).
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
          description: >
            Miniatura firmada, 320 px en el lado largo y en WebP. Nula en un
            PDF: solo las imagenes tienen. No cuenta en la cuota del hogar.
        uploadedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Nulo mientras la subida esta en curso. Una reserva sin completar ya
            ocupa cuota y no se puede adjuntar; el proceso diario la retira.
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid, nullable: true }

    StorageUsage:
      type: object
      description: Ocupacion y cuota del hogar. Las miniaturas no cuentan -- las genera el sistema.
      properties:
        usedBytes:
          type: integer
          format: int64
          description: Suma de los ficheros vivos del hogar
        quotaBytes:
          type: integer
          format: int64
          example: 1073741824
        maxFileBytes:
          type: integer
          format: int64
          example: 26214400

    ArticleInput:
      type: object
      description: >
        Definición reutilizable de un artículo del hogar. No es un asset -- no
        tiene ubicación ni cantidad.
      required: [name, categoryId, unit]
      properties:
        name:
          type: string
          description: Único en el hogar, comparado normalizado (sin mayúsculas ni acentos)
        categoryId:
          type: string
          format: uuid
          description: Categoría vigente del catálogo del hogar
        unit: { $ref: "#/components/schemas/MeasurementUnit" }
        brand: { type: string }
        model:
          type: string
          description: Marca y modelo juntos son la identidad real de un duradero
        barcode:
          type: string
          description: Opcional; único en el hogar si se informa
        packSize:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: >
            Contenido de un envase, en la unidad del artículo. Permite dar
            entrada a "dos paquetes" sin multiplicar a mano.
        unitWeightGrams:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: >
            Lo que pesa UNA unidad del artículo, en gramos. Opcional: ausente
            significa "no se sabe", y cero no vale porque afirmaría que no pesa.


            En gramos y no en la unidad del artículo, a propósito: el aviso de
            capacidad de una ubicación (readme 4.1.2) tiene que SUMAR entre
            artículos distintos, y con la unidad de cada uno no hay suma que
            hacer. De aquí sale ese aviso cuando la capacidad es de tipo WEIGHT.
        unitVolumeMl:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: >
            Lo que ocupa UNA unidad del artículo, en mililitros. Mismo criterio
            que unitWeightGrams, para la capacidad de tipo VOLUME.
        photoUrl:
          type: string
          format: uri
          description: >
            En escritura, enlace externo a la imagen. En lectura, la URL con la
            que se pinta: ese mismo enlace, o la URL FIRMADA de vida corta del
            fichero subido, que caduca en unos 15 minutos y no debe guardarse
            (ver readme.md 5.8.4).
        photoFileId:
          type: string
          format: uuid
          description: >
            Foto subida al servidor. Excluyente con photoUrl -- se admite una
            de las dos o ninguna, porque no tener foto es lo normal.
        notes: { type: string }
      not:
        required: [photoUrl, photoFileId]

    ArticlePatch:
      type: object
      description: >
        Todos los campos son opcionales; solo se aplica lo que llegue. unit no
        se acepta si el artículo ya tiene existencias vivas -- responde
        ARTICLE_UNIT_IMMUTABLE--, porque la cantidad ya contada se lleva en ella.
      properties:
        name: { type: string }
        categoryId: { type: string, format: uuid }
        unit: { $ref: "#/components/schemas/MeasurementUnit" }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        packSize:
          type: number
          nullable: true
          exclusiveMinimum: true
          minimum: 0
        unitWeightGrams:
          type: number
          nullable: true
          exclusiveMinimum: true
          minimum: 0
        unitVolumeMl:
          type: number
          nullable: true
          exclusiveMinimum: true
          minimum: 0
        photoUrl: { type: string, format: uri, nullable: true }
        photoFileId:
          type: string
          format: uuid
          nullable: true
          description: Nulo desadjunta la foto sin borrar el fichero
        notes: { type: string, nullable: true }
      not:
        required: [photoUrl, photoFileId]

    Article:
      allOf:
        - $ref: "#/components/schemas/ArticleInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            category:
              type: string
              description: Nombre de la categoría, resuelto para lectura
            photoThumbnailUrl:
              type: string
              format: uri
              nullable: true
              description: Miniatura firmada, para listados. Solo si la foto es un fichero subido
            createdAt: { type: string, format: date-time }
            retiredAt:
              type: string
              format: date-time
              nullable: true
              description: Informado si el artículo está retirado del catálogo
        - $ref: "#/components/schemas/Authorship"

    LocationRef:
      type: object
      description: >
        Referencia polimórfica a la ubicación de un asset. Los dos campos van
        juntos: type dice si apunta a otro asset o a una ubicación, e id a cuál.
        Solo un DURABLE puede hacer de ubicación de otros assets.
      required: [type, id]
      properties:
        type: { type: string, enum: [ASSET, LOCATION] }
        id: { type: string, format: uuid }

    AssetInput:
      type: object
      description: >
        Alta de un asset DURABLE. No admite quantity. name y categoryId son
        obligatorios salvo que se informe articleId, en cuyo caso se heredan
        del artículo.
      required: [type]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/AssetType" }
        categoryId: { type: string, format: uuid }
        articleId:
          type: string
          format: uuid
          description: Opcional en un DURABLE -- comparte definición entre unidades idénticas
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: Opcional -- un asset puede quedar sin propietario tras una baja de usuario
        location: { $ref: "#/components/schemas/LocationRef" }
        serialNumber:
          type: string
          description: Solo DURABLE
        acquiredOn:
          type: string
          format: date
          description: Solo DURABLE
        photoUrl:
          type: string
          format: uri
          description: >
            En escritura, enlace externo a la imagen. En lectura, la URL con la
            que se pinta: ese mismo enlace, o la URL FIRMADA de vida corta del
            fichero subido, que caduca en unos 15 minutos y no debe guardarse
            (ver readme.md 5.8.4).
        photoFileId:
          type: string
          format: uuid
          description: Foto subida al servidor. Excluyente con photoUrl
        notes: { type: string }
      # name y categoryId son obligatorios salvo que se herede del articulo.
      anyOf:
        - required: [articleId]
        - required: [name, categoryId]
      # Foto: enlace o fichero, nunca los dos. Los dos vacios SI valen -- no
      # tener foto es lo normal --, asi que esto es "como mucho uno", no oneOf.
      not:
        required: [photoUrl, photoFileId]

    AssetIntakeInput:
      type: object
      description: >
        Entrada de un consumible. Exactamente uno de articleId o article:
        el primero referencia un artículo del catálogo, el segundo lo crea en la
        misma operación. La cantidad va en la unidad del artículo.
      required: [ownerId, quantity]
      properties:
        articleId: { type: string, format: uuid }
        article: { $ref: "#/components/schemas/ArticleInput" }
        ownerId: { type: string, format: uuid }
        location: { $ref: "#/components/schemas/LocationRef" }
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Cantidad que entra, se suma a la existencia si ya la hay
      oneOf:
        - required: [articleId]
        - required: [article]

    AssetMergeInput:
      type: object
      description: >
        Destino de la fusión. El origen es el asset de la ruta, que es el que
        desaparece.
      required: [targetAssetId]
      properties:
        targetAssetId:
          type: string
          format: uuid
          description: Existencia que absorbe la cantidad y sobrevive

    AssetPatch:
      type: object
      description: >
        Modificación parcial. El tipo es inmutable y no se acepta aquí.
        cantidad solo es válida sobre un asset CONSUMABLE, y es absoluta.
        nombre y categoryId solo son válidos en un asset sin artículo -- si lo
        tiene, se cambian en el artículo. estado no se acepta: lo gobiernan
        DELETE /assets/{id}, POST /loans y POST /loans/{id}/return. ownerId es
        la vía para reasignar un asset huérfano. serialNumber y acquiredOn son
        al revés que cantidad: solo valen sobre un DURABLE.
      properties:
        name: { type: string }
        categoryId: { type: string, format: uuid }
        articleId:
          type: string
          format: uuid
          description: Solo para asignar artículo a un DURABLE que aún no lo tiene
        ownerId: { type: string, format: uuid }
        location: { $ref: "#/components/schemas/LocationRef" }
        quantity: { type: number, minimum: 0 }
        serialNumber:
          type: string
          nullable: true
          description: >
            Solo sobre un DURABLE. Se corrige después del alta porque casi nunca
            se tiene delante al dar de alta: la etiqueta está detrás del aparato.
        acquiredOn:
          type: string
          format: date
          nullable: true
          description: Solo sobre un DURABLE. Es procedencia, no valor.
        photoUrl: { type: string, format: uri, nullable: true }
        photoFileId:
          type: string
          format: uuid
          nullable: true
          description: >
            Excluyente con photoUrl. Ponerlo a null desadjunta la foto y marca
            el fichero para su retirada: la cuota se libera en el acto y los
            bytes los desenlaza el proceso diario.
        notes: { type: string }

    Asset:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid }
            name:
              type: string
              description: Propio del asset, o resuelto desde su artículo cuando lo tiene.
            type: { $ref: "#/components/schemas/AssetType" }
            categoryId:
              type: string
              format: uuid
              description: Propia del asset, o resuelta desde su artículo cuando lo tiene.
            category:
              type: string
              description: Nombre de la categoría, resuelto para lectura.
            articleId:
              type: string
              format: uuid
              nullable: true
              description: Siempre presente en CONSUMABLE; opcional en DURABLE.
            ownerId:
              type: string
              format: uuid
              nullable: true
              description: Nulo si su propietario causó baja y aún no se ha reasignado.
            serialNumber: { type: string, nullable: true }
            acquiredOn: { type: string, format: date, nullable: true }
            photoUrl:
              type: string
              format: uri
              nullable: true
              description: >
                Enlace externo, o URL FIRMADA de vida corta cuando la foto vive
                aqui. Caduca con el access token y no debe guardarse.
            photoThumbnailUrl:
              type: string
              format: uri
              nullable: true
              description: >
                Miniatura firmada, para listados. Nula si la foto es un enlace
                externo, porque de esa no se genera nada.
            photoFileId: { type: string, format: uuid, nullable: true }
            notes: { type: string, nullable: true }
            location: { $ref: "#/components/schemas/LocationRef" }
            status: { $ref: "#/components/schemas/AssetStatus" }
            quantity:
              type: number
              nullable: true
              description: Solo presente en assets CONSUMABLE.
            unit:
              allOf:
                - $ref: "#/components/schemas/MeasurementUnit"
              nullable: true
              description: Resuelta desde el artículo; solo presente si el asset lo tiene.
            warnings:
              type: array
              description: >
                Advertencias de la operación que acaba de tener éxito. Vacío en
                el caso normal. NO son errores: la operación se hizo, la
                respuesta es 200 o 201, y el asset devuelto es el estado real.
                Existe porque hay una regla que advierte sin bloquear -- superar
                la capacidad declarada de una ubicación (ver readme.md 4.1.2) --
                y sin este campo no habría por dónde contarlo: el sistema no
                sabe cuánto ocupa cada cosa, así que bloquear con datos
                incompletos impediría guardar algo que sí cabe.
              items: { $ref: "#/components/schemas/Warning" }
            createdAt: { type: string, format: date-time }
        - $ref: "#/components/schemas/Authorship"

    Warning:
      type: object
      description: >
        Un aviso que acompaña a una operación con éxito. El cliente decide qué
        hacer por el code, igual que con los errores, y por el mismo motivo:
        distinguir por el texto obliga a leer castellano.
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - LOCATION_CAPACITY_EXCEEDED
          description: >
            LOCATION_CAPACITY_EXCEEDED -- la ubicación declara una capacidad y,
            contando este asset, se supera.


            Las tres formas se comprueban. UNITS es exacta: contar piezas no
            necesita ninguna medida. WEIGHT y VOLUME suman la medida que pone el
            artículo (unitWeightGrams, unitVolumeMl) por la cantidad, y por eso
            SOLO avisan cuando lo conocido YA se pasa: una suma a la que le
            faltan artículos sin medir solo puede quedarse corta, así que
            pasarse es concluyente y caber no lo es. Cuando cabe y falta por
            medir, no se avisa nada.
        message:
          type: string
          description: Explicación para una persona, en el idioma de la instalación.

    LocationType:
      type: string
      description: >
        Naturaleza del contenedor, no de lo que se guarda dentro.
      enum: [HOUSE, FLOOR, ROOM, FURNITURE, SHELF, OTHER]

    LocationInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          description: Único entre las ubicaciones con el mismo padre
        type: { $ref: "#/components/schemas/LocationType" }
        parentLocationId: { type: string, format: uuid }
        capacity:
          type: object
          description: >
            Opcional. Superarla advierte, no bloquea -- el asset no lleva peso
            ni volumen, así que solo el recuento de unidades es fiable.
          required: [type, max, unit]
          properties:
            type: { type: string, enum: [WEIGHT, VOLUME, UNITS] }
            max: { type: number }
            unit: { type: string, example: kg }
        environmentalConditions:
          type: object
          description: Todas opcionales -- solo se informan si son relevantes.
          properties:
            minTemperature: { type: number, description: En grados Celsius }
            maxTemperature: { type: number, description: En grados Celsius }
            minHumidity: { type: number, description: En porcentaje }
            maxHumidity: { type: number, description: En porcentaje }
            lightExposure:
              type: string
              enum: [DIRECT, INDIRECT, DARKNESS]
        photoUrl:
          type: string
          format: uri
          description: >
            En escritura, enlace externo a la imagen. En lectura, la URL con la
            que se pinta: ese mismo enlace, o la URL FIRMADA de vida corta del
            fichero subido, que caduca en unos 15 minutos y no debe guardarse
            (ver readme.md 5.8.4).
        photoFileId:
          type: string
          format: uuid
          description: Foto subida al servidor. Excluyente con photoUrl
        notes: { type: string }
      not:
        required: [photoUrl, photoFileId]

    LocationPatch:
      type: object
      description: >
        Todos los campos son opcionales. Cambiar parentLocationId mueve la
        ubicación dentro de la jerarquía; el tipo también puede corregirse,
        porque no cambia el comportamiento de nada.
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/LocationType" }
        parentLocationId:
          type: string
          format: uuid
          nullable: true
          description: Nulo la convierte en raíz, que es lo que representa una vivienda
        capacity:
          type: object
          nullable: true
          required: [type, max, unit]
          properties:
            type: { type: string, enum: [WEIGHT, VOLUME, UNITS] }
            max: { type: number }
            unit: { type: string, example: kg }
        environmentalConditions:
          type: object
          nullable: true
          properties:
            minTemperature: { type: number }
            maxTemperature: { type: number }
            minHumidity: { type: number }
            maxHumidity: { type: number }
            lightExposure: { type: string, enum: [DIRECT, INDIRECT, DARKNESS] }
        photoUrl: { type: string, format: uri, nullable: true }
        photoFileId:
          type: string
          format: uuid
          nullable: true
          description: Nulo desadjunta la foto sin borrar el fichero
        notes: { type: string, nullable: true }
      not:
        required: [photoUrl, photoFileId]

    Location:
      allOf:
        - $ref: "#/components/schemas/LocationInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            photoThumbnailUrl:
              type: string
              format: uri
              nullable: true
              description: Miniatura firmada, para listados. Solo si la foto es un fichero subido
            createdAt: { type: string, format: date-time }
        - $ref: "#/components/schemas/Authorship"

    InvitationInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          description: Normalizado a minusculas, como en la identidad
        role: { $ref: "#/components/schemas/UserRole" }

    Invitation:
      type: object
      description: >
        El estado no es un campo: se deduce de expiresAt, acceptedAt y
        revokedAt.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        expiresAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid, nullable: true }

    InvitationAcceptInput:
      type: object
      required: [token]
      properties:
        token: { type: string }
        name:
          type: string
          description: Solo si la identidad no existia todavia
        password:
          type: string
          format: password
          minLength: 12
          description: Solo si la identidad no existia todavia

    User:
      description: >
        Es una PERTENENCIA a un hogar (HouseholdMember), no la identidad. id
        es el memberId, que es lo que referencian propietario de asset,
        prestamos y autoria. Los datos de la persona -- name, email, phone,
        avatarUrl, lastLoginAt -- se resuelven desde su identidad, que vive
        fuera del hogar.
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid }
            identityId: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string, nullable: true }
            role: { $ref: "#/components/schemas/UserRole" }
            avatarUrl:
              type: string
              format: uri
              nullable: true
              description: >
                Enlace externo, o URL FIRMADA de vida corta del avatar subido
                -- se pinta en un <img> como cualquier otra foto. Es de la
                IDENTIDAD, no del hogar: no cuenta en la cuota de nadie (ver
                readme.md 4.1.1), y cerrar la cuenta lo borra.
            lastLoginAt: { type: string, format: date-time, nullable: true }
            emailVerifiedAt:
              type: string
              format: date-time
              nullable: true
              description: Resuelto desde la identidad. Vacío impide iniciar sesión
            deactivatedAt:
              type: string
              format: date-time
              nullable: true
              description: Informado si esa persona ha dejado este hogar -- no cierra su cuenta
        - $ref: "#/components/schemas/Authorship"

    LoanExternal:
      type: object
      description: >
        Persona ajena al hogar. Hace falta un canal porque es por donde se
        manda el enlace con el token acotado -- al menos uno de email o
        telefono.
      required: [name]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }

    LoanParticipant:
      type: object
      description: Exactamente uno de los dos campos -- usuario del hogar o persona externa.
      properties:
        userId: { type: string, format: uuid }
        external: { $ref: "#/components/schemas/LoanExternal" }
      # Con los dos presentes ambas ramas encajan y oneOf exige exactamente una,
      # asi que rechaza tanto los dos a la vez como ninguno.
      oneOf:
        - required: [userId]
        - required: [external]

    LoanInput:
      type: object
      required: [assetId, lender, borrower]
      properties:
        assetId: { type: string, format: uuid }
        lender: { $ref: "#/components/schemas/LoanParticipant" }
        borrower: { $ref: "#/components/schemas/LoanParticipant" }
        dueAt:
          type: string
          format: date-time
          description: Opcional -- sin ella el préstamo nunca vence
        notes: { type: string }

    Loan:
      description: >
        La vista completa, la que ve un usuario del hogar. Lo que un token
        acotado recibe en su lugar es LoanExternalView, y los dos se declaran
        juntos en LoanView.
      allOf:
        - type: object
          # Estos siete siempre vienen en la vista completa, y decirlo aqui es
          # lo que hace disjuntas las dos ramas de LoanView: un payload al que
          # le falte lender o borrower no puede ser un Loan.
          required: [id, assetId, assetName, lender, borrower, status, startedAt]
          properties:
            id: { type: string, format: uuid }
            assetId: { type: string, format: uuid }
            assetName:
              type: string
              description: >
                Nombre del asset, resuelto para lectura. Es el único dato del asset
                que ve un token acotado (ver readme.md 5.4.3).
            lender: { $ref: "#/components/schemas/LoanParticipant" }
            borrower: { $ref: "#/components/schemas/LoanParticipant" }
            status:
              type: string
              description: >
                OVERDUE lo marca un proceso diario, no una acción del usuario. Un
                préstamo OVERDUE sigue ocupando el asset -- vencer no es devolver.
              enum: [ACTIVE, RETURNED, OVERDUE]
            startedAt: { type: string, format: date-time }
            dueAt: { type: string, format: date-time, nullable: true }
            returnedAt: { type: string, format: date-time, nullable: true }
            notes: { type: string, nullable: true }
        - $ref: "#/components/schemas/Authorship"

    LoanExternalView:
      type: object
      description: >
        Lo que ve quien llega con un token acotado: una persona ajena al hogar
        que solo necesita saber que tiene, en que estado esta y para cuando.
        No lleva assetId, ni lender, ni borrower, ni notes, ni autoria, y eso
        **no es una omision sino el alcance del token** -- su credencial da
        acceso a un prestamo, no al hogar que lo registro.
      required: [id, assetName, status, startedAt, role]
      # Cerrado a proposito, y no solo por higiene: es lo que impide que la
      # vista completa encaje tambien aqui y deje ambigua la rama de LoanView.
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        role:
          type: string
          enum: [LENDER, BORROWER]
          description: >
            En cual de los dos extremos esta quien pregunta, tomado del token y
            no del cuerpo. La pantalla externa lo necesita porque **la mitad de
            su texto depende de el**: quien presto reclama que le devuelvan y
            quien recibio confirma que ha devuelto, con la misma anatomia.


            No revela nada: quien tiene el token ya sabe si presto o recibio.
            La alternativa era que el cliente descodificase el claim del propio
            JWT, que obliga al frontend a interpretar una credencial en vez de
            leer una respuesta.
        assetName:
          type: string
          description: El unico dato del asset que sale de casa. Un nombre, sin identificador ni foto
        status:
          type: string
          enum: [ACTIVE, RETURNED, OVERDUE]
        startedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time, nullable: true }
        returnedAt:
          type: string
          format: date-time
          nullable: true
          description: Informado tras confirmar la devolucion, para que quien la confirmo la vea hecha

    LoanView:
      description: >
        Un prestamo visto por quien pregunta. **Es lo unico de toda la API que
        devuelve dos formas distintas segun la credencial**: la completa con
        sesion del hogar y la acotada con token de prestamo (ver readme.md,
        5.4.1 y 5.4.3).


        Se declara en vez de dejarlo en la prosa porque la ADR-007 hace del
        contrato la fuente de los tipos del cliente, y un solo esquema
        prometeria lender y borrower a una pantalla que nunca los recibe. Las
        dos ramas son disjuntas --Loan exige siete campos que la acotada no
        tiene, y la acotada no admite ninguno de mas-- asi que oneOf resuelve
        siempre a una.
      oneOf:
        - $ref: "#/components/schemas/Loan"
        - $ref: "#/components/schemas/LoanExternalView"

    # --- Colecciones paginadas -------------------------------------------
    # Diez esquemas para doce endpoints paginados: los dos listados de hijos
    # --de un asset y de una ubicacion-- reutilizan el de su tipo, porque
    # devuelven lo mismo acotado de otra forma. Uno por tipo y no uno generico
    # porque OpenAPI 3.0 no tiene genericos. Todos comparten PageMeta, asi que
    # el cliente generado ve la misma forma en las doce.

    ArticlePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Article" }

    AssetPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Asset" }

    CategoryPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Category" }

    DocumentPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Document" }

    InvitationPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Invitation" }

    LoanPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Loan" }

    LocationPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Location" }

    Notice:
      type: object
      required: [id, kind, title, body, createdAt]
      description: >
        Algo que el hogar tiene que saber, encontrado por una comprobación
        periódica. Lo escribe el recorrido diario, nunca una persona.
      properties:
        id: { type: string, format: uuid }
        moduleKey:
          type: string
          nullable: true
          example: WAREHOUSE
          description: >
            De qué módulo es la regla que lo generó, o NULO si es del core. Es
            lo que hace que un aviso de préstamo vencido siga llegando a un
            hogar sin ningún módulo encendido.
        kind:
          type: string
          example: LOANS_OVERDUE
          description: >
            Qué clase de aviso es. Identificador, así que inglés y
            UPPER_SNAKE_CASE: el cliente lo usa para agrupar o elegir un icono
            sin tener que leer el título.
        title:
          type: string
          example: 2 préstamos han vencido
          description: Lo que ve la persona. Es un dato, así que va en castellano.
        body: { type: string }
        createdAt: { type: string, format: date-time }
        readAt:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se vio por primera vez. Nulo es "sin leer".
        readBy:
          type: string
          format: uuid
          nullable: true
          description: >
            La PERTENENCIA que lo marcó, no la identidad, igual que toda autoría
            del core. Es lo que permite saber a quién preguntarle por un aviso
            que alguien ya dio por visto.

    NoticePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Notice" }

    ModulePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/HouseholdModule" }

    StoredFilePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/StoredFile" }

    UserPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/User" }

    ServiceCategory:
      type: string
      description: >
        A qué se dedica un contacto de servicio. LISTA CERRADA, al contrario que
        la categoría de un asset, que es un catálogo por hogar: aquella clasifica
        lo que el hogar tiene, que no tiene fin porque una casa compra cosas que
        nadie previó; esta clasifica a qué se dedica quien viene a casa, que es
        un mundo mucho más corto.


        OTHER es la salida, y a la vez el disparador de revisar la decisión: el
        día que sea la más usada, la lista dejó de clasificar y toca convertirla
        en catálogo por hogar. Está anotado en la ficha del módulo.


        El rótulo que se lee en pantalla es un dato y lo pone el cliente en
        castellano; esto es un identificador.
      enum:
        - PLUMBING
        - ELECTRICITY
        - HEATING_COOLING
        - APPLIANCES
        - CARPENTRY
        - MASONRY
        - PAINTING
        - LOCKSMITH
        - CLEANING
        - GARDENING
        - PEST_CONTROL
        - VEHICLE
        - UTILITIES
        - OTHER

    SupplierInput:
      type: object
      required: [name, serviceCategory]
      description: >
        Los cinco datos de contacto son opcionales UNO A UNO y obligatorios EN
        CONJUNTO: hace falta al menos teléfono, correo o web. Esa regla no se
        puede expresar campo a campo, así que responde 409 y no 400.
      properties:
        name: { type: string, maxLength: 160, example: Fontanería Pérez }
        serviceCategory: { $ref: "#/components/schemas/ServiceCategory" }
        contactName:
          type: string
          maxLength: 160
          nullable: true
          description: La persona con la que se habla dentro de una empresa. Nulo cuando el contacto ES la persona
        phone: { type: string, maxLength: 40, nullable: true }
        email: { type: string, maxLength: 320, nullable: true }
        website: { type: string, maxLength: 500, nullable: true }
        address:
          type: string
          maxLength: 500
          nullable: true
          description: No cuenta como forma de contacto -- sirve para llegar, no para llamar
        notes: { type: string, nullable: true }

    SupplierPatch:
      type: object
      description: >
        Modificación parcial. Un campo AUSENTE no se toca; un campo presente a
        NULO se borra. Las dos cosas son distintas y el contrato las distingue en
        todos sus PATCH.
      properties:
        name: { type: string, maxLength: 160 }
        serviceCategory: { $ref: "#/components/schemas/ServiceCategory" }
        contactName: { type: string, maxLength: 160, nullable: true }
        phone: { type: string, maxLength: 40, nullable: true }
        email: { type: string, maxLength: 320, nullable: true }
        website: { type: string, maxLength: 500, nullable: true }
        address: { type: string, maxLength: 500, nullable: true }
        notes: { type: string, nullable: true }

    Supplier:
      type: object
      required: [id, name, serviceCategory, createdAt, updatedAt]
      description: >
        Un contacto de servicio del hogar. NO distingue empresa de persona: el
        servicio técnico de la caldera y el electricista del barrio se guardan
        igual porque lo que el hogar necesita de los dos es lo mismo.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        serviceCategory: { $ref: "#/components/schemas/ServiceCategory" }
        contactName: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        website: { type: string, nullable: true }
        address: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        retiredAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Con valor, el contacto está retirado: no se ofrece al enlazar y no
            sale en el listado por defecto. Sus enlaces se conservan.
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }

    SupplierLinkInput:
      type: object
      description: >
        EXACTAMENTE UNO de los dos. Ni ninguno ni los dos: eso responde 409
        SUPPLIER_LINK_TARGET_INVALID, que es una regla del contrato con código
        propio y no un error de forma.
      properties:
        assetId: { type: string, format: uuid, nullable: true }
        locationId: { type: string, format: uuid, nullable: true }

    SupplierLink:
      type: object
      required: [id, targetType, targetId, targetName, createdAt]
      description: >
        El enlace de un contacto con algo del core, aplanado a targetType +
        targetId + targetName. Dentro son dos columnas excluyentes; aquí son tres
        campos, porque dos claves opcionales obligarían al cliente a comprobar
        cuál viene informada cada vez que pinta una fila.
      properties:
        id: { type: string, format: uuid }
        targetType:
          type: string
          enum: [ASSET, LOCATION]
        targetId: { type: string, format: uuid }
        targetName:
          type: string
          description: >
            El nombre que el core le da HOY, resuelto al leer y no copiado: si la
            caldera se renombra, esto lo dice sin que nadie sincronice nada.
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid, nullable: true }

    SupplierDetail:
      type: object
      required: [supplier, links]
      properties:
        supplier: { $ref: "#/components/schemas/Supplier" }
        links:
          type: array
          items: { $ref: "#/components/schemas/SupplierLink" }


    StockItem:
      type: object
      required: [assetId, articleId, article, unit, quantity, belowMinimum, lotCount]
      description: >
        Una existencia vista por el almacén.


        La quantity es LA DEL CORE, leída de assets al responder. Warehouse no
        lleva un segundo contador: el core mantiene uno, y este módulo guarda
        consumos, mínimos, caducidad y lotes. Lo que este esquema añade sobre un
        Asset es exactamente lo que es del módulo.
      properties:
        assetId:
          type: string
          format: uuid
          description: El asset del CORE. Warehouse no tiene identificador propio de existencia
        articleId: { type: string, format: uuid }
        article:
          type: string
          description: Nombre del artículo, resuelto del core para lectura
        unit: { $ref: "#/components/schemas/MeasurementUnit" }
        locationId: { type: string, format: uuid, nullable: true }
        location: { type: string, nullable: true }
        quantity:
          type: number
          description: Del core. Ver la descripción del esquema
        minimumQuantity:
          type: number
          nullable: true
          description: Nulo significa que este hogar no vigila ese artículo
        belowMinimum:
          type: boolean
          description: >
            Estar EN el mínimo ya cuenta: tener justo lo último es momento de
            reponer.
        nearestExpiry:
          type: string
          format: date
          nullable: true
          description: La caducidad más próxima de sus lotes vivos
        lotCount:
          type: integer
          description: Cuántos lotes vivos tiene. Pueden cubrir menos que la cantidad

    StockItemDetail:
      type: object
      required: [item, lots, movements]
      properties:
        item: { $ref: "#/components/schemas/StockItem" }
        expiryLeadDays:
          type: integer
          nullable: true
          description: >
            La antelación que le aplica, resuelta por la cadena sitio ->
            artículo. Nulo significa que ninguno de los dos la fija y vale la del
            módulo.
        lots:
          type: array
          items: { $ref: "#/components/schemas/StockLot" }
        movements:
          type: array
          description: Los últimos movimientos. El cuaderno entero tiene su operación
          items: { $ref: "#/components/schemas/StockMovement" }

    StockItemPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StockItem" }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }

    MovementKind:
      type: string
      description: >
        Por qué se movió. INTAKE, ADJUSTMENT, MERGE y DECOMMISSION son los cuatro
        motivos del core, con el mismo nombre a propósito: renombrarlos daría dos
        vocabularios para el mismo hecho. OPENING es lo que había el día que el
        módulo se encendió -- no lo cuenta ningún evento porque pasó antes-- y
        RELOCATION es un movimiento que no cambia ninguna cantidad.
      enum: [OPENING, INTAKE, ADJUSTMENT, MERGE, DECOMMISSION, RELOCATION]

    StockMovement:
      type: object
      required: [id, assetId, kind, occurredAt]
      description: >
        Un asiento del cuaderno. No se modifica nunca, así que no lleva
        updatedAt ni updatedBy.
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        articleId: { type: string, format: uuid, nullable: true }
        locationId:
          type: string
          format: uuid
          nullable: true
          description: >
            Puede apuntar a un sitio ya borrado: DELETE /locations/{id} borra la
            fila de verdad y el cuaderno no se reescribe.
        location:
          type: string
          nullable: true
          description: >
            El nombre que tenía ESE DÍA, guardado con el asiento. Es lo único que
            sigue diciendo dónde pasó aquello cuando el sitio ya no existe --
            mismo criterio que un aviso, que lleva su texto dentro.
        kind: { $ref: "#/components/schemas/MovementKind" }
        previousQuantity:
          type: number
          nullable: true
          description: Nulo en una RELOCATION, que no cambia ninguna cantidad
        quantity: { type: number, nullable: true }
        delta:
          type: number
          nullable: true
          description: Lo que entró o salió. Derivado, no guardado por separado
        occurredAt: { type: string, format: date-time }

    StockMovementPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StockMovement" }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }

    StockLotInput:
      type: object
      required: [assetId, expiresOn, quantity]
      properties:
        assetId:
          type: string
          format: uuid
          description: La existencia del core sobre la que va el lote
        lotCode:
          type: string
          description: >
            Opcional: la mitad de lo que hay en una despensa no lo lleva a la
            vista. Dos lotes SIN código y con la misma fecha sobre la misma
            existencia chocan igual.
        expiresOn: { type: string, format: date }
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Cuánto de lo que hay es de este lote

    StockLot:
      allOf:
        - $ref: "#/components/schemas/StockLotInput"
        - type: object
          required: [id, articleId]
          properties:
            id: { type: string, format: uuid }
            articleId: { type: string, format: uuid }
            consumedAt:
              type: string
              format: date-time
              nullable: true
              description: Informado si el lote se dio por consumido. No toca el contador del core

    StockLotPatch:
      type: object
      description: >
        Todos los campos son opcionales; solo se aplica lo que llegue. expiresOn
        y quantity no admiten nulo.
      properties:
        lotCode: { type: string, nullable: true }
        expiresOn: { type: string, format: date }
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0

    StockLotPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StockLot" }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }

    WarehouseArticlePatch:
      type: object
      description: >
        Todos los campos son opcionales; solo se aplica lo que llegue, y el nulo
        borra.
      properties:
        minimumQuantity:
          type: number
          minimum: 0
          nullable: true
          description: Nulo deja de vigilar el artículo y limpia su estado de bajo mínimos
        expiryLeadDays:
          type: integer
          minimum: 0
          nullable: true
          description: >
            Nulo NO es cero: nulo significa "usa la del sitio, o la del módulo",
            y cero significa "avísame el mismo día".

    WarehouseArticle:
      type: object
      required: [articleId]
      description: La ficha del almacén sobre un artículo del core. No duplica nada suyo
      properties:
        articleId: { type: string, format: uuid }
        minimumQuantity: { type: number, nullable: true }
        expiryLeadDays: { type: integer, nullable: true }
        lowStockSince:
          type: string
          format: date-time
          nullable: true
          description: >
            DESDE CUÁNDO está por debajo del mínimo, y no un booleano. Un booleano
            se puede calcular al vuelo y por eso no sirve: sin fecha de entrada, la
            comprobación nocturna no distingue "acaba de caer" de "lleva tres
            semanas caído" y avisaría las treinta noches.

    WarehouseLocationPatch:
      type: object
      properties:
        expiryLeadDays: { type: integer, minimum: 0, nullable: true }
        notes: { type: string, nullable: true }

    WarehouseLocation:
      type: object
      required: [locationId]
      description: La ficha del almacén sobre un sitio del core
      properties:
        locationId: { type: string, format: uuid }
        expiryLeadDays: { type: integer, nullable: true }
        notes: { type: string, nullable: true }

    SupplierPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Supplier" }

    ShoppingItemOrigin:
      type: string
      description: >
        Por qué entró la línea. EL ORDEN NO ES ALFABÉTICO Y NO ES CASUAL: es el que
        decide qué noticia manda cuando el mismo artículo vuelve a dar señal, y el
        que ordena la lista. Acabarse es más fuerte que bajar del mínimo, y las dos
        más que haberlo apuntado a mano -- que ya estaba dicho.


        MANUAL es EL ÚNICO QUE EXISTE CON WAREHOUSE APAGADO, y está bien que así
        sea: sin ese módulo nadie está detectando la falta.
      enum: [MANUAL, LOW_STOCK, DEPLETED]

    ShoppingItemStatus:
      type: string
      description: >
        NEEDED hace falta, IN_PURCHASE va en una compra abierta, BOUGHT ya entró en
        casa, DISMISSED se descartó sin comprar. Los dos primeros son los vivos:
        son los que cuentan para la regla de una sola línea por artículo.
      enum: [NEEDED, IN_PURCHASE, BOUGHT, DISMISSED]

    PurchaseStatus:
      type: string
      enum: [OPEN, RECEIVED, CANCELLED]

    ShoppingItem:
      type: object
      required: [id, name, origin, status, createdAt, updatedAt]
      description: >
        Una línea de la lista. name es el del artículo del CORE cuando lo tiene, y
        el nombre suelto cuando no: siempre hay uno, y nunca hay dos.
      properties:
        id: { type: string, format: uuid }
        articleId:
          type: string
          format: uuid
          nullable: true
          description: Del core. Nulo en una línea de texto suelto, que no entra en el inventario
        name: { type: string }
        unit:
          type: string
          nullable: true
          description: La del artículo, del core. Nula en una línea de texto suelto
        packLabel:
          type: string
          nullable: true
          description: >
            "6 UNIT", "5 LITER" -- LA PRESENTACIÓN DE COMPRA, COMPUESTA Y NO
            GUARDADA a partir del packSize y la unit del artículo. Es la respuesta
            de este módulo a si esa presentación necesita nombre propio: no, porque
            un texto libre sería una segunda fuente de verdad que puede contradecir
            al envase. Nulo si el artículo no declara envase, que es lo normal
        quantity:
          type: number
          nullable: true
          description: Cuánta hace falta. NULO ES LEGÍTIMO -- "hace falta arroz" es una línea completa
        origin: { $ref: "#/components/schemas/ShoppingItemOrigin" }
        status: { $ref: "#/components/schemas/ShoppingItemStatus" }
        note: { type: string, nullable: true }
        purchaseId: { type: string, format: uuid, nullable: true }
        receivedAssetId:
          type: string
          format: uuid
          nullable: true
          description: La existencia del core que resultó al recibirla. La traza de que el ciclo se cerró
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ShoppingItemPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ShoppingItem" }

    ShoppingItemInput:
      type: object
      description: articleId O name, nunca los dos y nunca ninguno
      properties:
        articleId: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        quantity: { type: number, exclusiveMinimum: true, minimum: 0 }
        note: { type: string, maxLength: 500 }

    ShoppingItemPatch:
      type: object
      description: >
        Ausente no se toca, presente a nulo se borra. articleId se puede cambiar y
        NO vaciar: asignarlo es lo que convierte una línea de texto suelto en una
        que sí puede entrar en el inventario
      properties:
        articleId: { type: string, format: uuid }
        quantity: { type: number, nullable: true }
        note: { type: string, nullable: true }

    Purchase:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        supplierId:
          type: string
          format: uuid
          nullable: true
          description: >
            De Proveedores, SIN CLAVE AJENA hacia su tabla: una clave ajena entre
            dos módulos sería una dependencia de esquema que nada vigila
        supplier:
          type: string
          nullable: true
          description: >
            EL NOMBRE DE AQUEL DÍA, copiado al abrir la compra. Es lo único que se
            puede pintar con Proveedores apagado, y además lo correcto: una compra
            es historia
        status: { $ref: "#/components/schemas/PurchaseStatus" }
        note: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    PurchasePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Purchase" }

    PurchaseDetail:
      type: object
      required: [purchase, lines]
      description: Una compra con sus líneas, que es como se lee siempre -- sola no dice nada
      properties:
        purchase: { $ref: "#/components/schemas/Purchase" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ShoppingItem" }

    PurchaseInput:
      type: object
      required: [itemIds]
      properties:
        supplierId:
          type: string
          format: uuid
          description: >
            Opcional. Se valida contra Proveedores por un puerto de plataforma; si
            ese módulo está apagado responde igual que ante un identificador que no
            existe
        note: { type: string, maxLength: 500 }
        itemIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }

    ReceiptInput:
      type: object
      required: [lines]
      description: >
        Puede ir con la lista vacía si todas las líneas ya traían cantidad: lo que
        no se diga cae en su valor por omisión
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/ReceiptLine" }

    ReceiptLine:
      type: object
      required: [itemId]
      description: >
        Los tres campos opcionales son la decisión de producto del módulo: cuánta
        entró, de quién es y dónde va se deciden AL RECIBIR y no al apuntar
      properties:
        itemId: { type: string, format: uuid }
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Por omisión, la que la línea apuntaba
        ownerId:
          type: string
          format: uuid
          description: Por omisión, quien recibe la compra
        locationId:
          type: string
          format: uuid
          description: >
            Por omisión, DONDE ESE ARTÍCULO YA VIVE si vive en un solo sitio. No es
            comodidad: la entrada del core busca la existencia por artículo Y
            ubicación, así que sin esto la despensa acabaría con dos arroces

    PurchasingSupplier:
      type: object
      required: [id, name]
      description: >
        Lo mínimo que el puerto de dato maestro deja pasar. Ni teléfono ni correo:
        los datos personales de terceros se quedan en Proveedores
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        detail:
          type: string
          nullable: true
          description: >
            El IDENTIFICADOR de la categoría de servicio, no su rótulo: el texto que
            se lee en pantalla es un dato en castellano y lo pone el cliente

    MaintenanceMachine:
      type: object
      required: [assetId, name, planCount]
      description: >
        Una máquina del hogar tal y como CMMS la ve. El nombre sale del core --del
        asset, o de su artículo-- al leer, y no se guarda en ninguna tabla de este
        módulo: dos copias del mismo nombre acaban diciendo cosas distintas el día
        que alguien renombre el asset.
      properties:
        assetId: { type: string, format: uuid }
        name: { type: string, description: Del core }
        manualDocumentId:
          type: string
          format: uuid
          nullable: true
          description: >
            Cuál de los documentos de esta máquina es el manual. Lo apunta el
            handler de DocumentAttached y se corrige con el PATCH
        notes: { type: string, nullable: true }
        planCount: { type: integer, description: Cuántos planes vivos tiene }
        nextDueOn:
          type: string
          format: date
          nullable: true
          description: La más próxima de sus fechas previstas. Nula si no tiene ningún plan vivo

    MaintenanceMachinePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/MaintenanceMachine" }

    MaintenanceMachineDetail:
      type: object
      required: [machine, plans, interventions]
      properties:
        machine: { $ref: "#/components/schemas/MaintenanceMachine" }
        plans:
          type: array
          items: { $ref: "#/components/schemas/MaintenancePlan" }
        interventions:
          type: array
          description: Las diez últimas. El histórico entero tiene su operación
          items: { $ref: "#/components/schemas/MaintenanceIntervention" }

    MaintenanceMachinePatch:
      type: object
      description: Un campo ausente no se toca; un campo a nulo se borra
      properties:
        manualDocumentId:
          type: string
          format: uuid
          nullable: true
          description: Tiene que colgar de ESTA máquina. A nulo, la máquina se queda sin manual
        notes: { type: string, nullable: true }

    MaintenancePlan:
      type: object
      required: [id, assetId, name, intervalMonths, leadDays, nextDueOn, createdAt, updatedAt]
      description: >
        Una REGLA RECURRENTE sobre una máquina. No lleva responsable ni día
        concreto, y eso es la frontera contra el planificador de tareas escrita en
        el propio esquema: un plan es una regla y una tarea es un encargo.
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        name: { type: string, example: Revisión anual }
        intervalMonths:
          type: integer
          minimum: 1
          maximum: 120
          description: Cada cuántos meses toca. En meses y no en días, para que el aniversario no se desplace
        leadDays:
          type: integer
          minimum: 0
          maximum: 365
          description: Con cuánta antelación avisar. Tiene que caber dentro del periodo
        nextDueOn:
          type: string
          format: date
          description: >
            Cuándo toca la próxima. Se guarda y no se calcula al leer, porque de
            ella cuelga el estado del aviso
        lastPerformedOn: { type: string, format: date, nullable: true }
        supplierId:
          type: string
          format: uuid
          nullable: true
          description: >
            El servicio técnico. SIN su nombre al lado: un plan es una regla viva y
            tiene que decir el nombre de hoy, así que se resuelve al leer
        notes: { type: string, nullable: true }
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          description: Baja lógica. El plan deja de vigilarse y conserva su histórico
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MaintenancePlanPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/MaintenancePlan" }

    MaintenancePlanDetail:
      type: object
      required: [plan, machineName, interventions]
      properties:
        plan: { $ref: "#/components/schemas/MaintenancePlan" }
        machineName: { type: string, description: Del core }
        supplier:
          allOf:
            - $ref: "#/components/schemas/MaintenanceSupplier"
          nullable: true
          description: >
            Resuelto al leer por el puerto de plataforma. Un contacto RETIRADO
            SIGUE SALIENDO AQUÍ -- un plan que apunte a quien ya no se llama tiene
            que poder decir a quién apuntaba -- aunque deje de ofrecerse en
            /maintenance/suppliers. Nulo si no hay, si ya no existe o si Proveedores
            está apagado
        interventions:
          type: array
          items: { $ref: "#/components/schemas/MaintenanceIntervention" }

    MaintenancePlanInput:
      type: object
      required: [assetId, name, intervalMonths, nextDueOn]
      properties:
        assetId:
          type: string
          format: uuid
          description: Un asset DURABLE vivo. Un consumible no se revisa
        name: { type: string, maxLength: 160, example: Revisión anual }
        intervalMonths: { type: integer, minimum: 1, maximum: 120 }
        leadDays:
          type: integer
          minimum: 0
          maximum: 365
          default: 15
          description: Opcional. Tiene que caber dentro del periodo
        nextDueOn: { type: string, format: date }
        supplierId: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }

    MaintenancePlanPatch:
      type: object
      description: >
        Un campo ausente no se toca. intervalMonths y nextDueOn no admiten nulo --un
        plan sin cada-cuánto o sin próxima fecha no es un plan-- y supplierId sí.
      properties:
        name: { type: string, maxLength: 160 }
        intervalMonths: { type: integer, minimum: 1, maximum: 120 }
        leadDays: { type: integer, minimum: 0, maximum: 365 }
        nextDueOn:
          type: string
          format: date
          description: Moverla REARMA el aviso, sin que haga falta pedirlo
        supplierId: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }

    InterventionKind:
      type: string
      description: >
        PREVENTIVE cumple un plan --o al menos lo parece: cambiar el filtro también
        lo es sin plan escrito--; CORRECTIVE arregla algo que se ha roto y nunca
        cuelga de un plan.
      enum: [PREVENTIVE, CORRECTIVE]

    MaintenanceIntervention:
      type: object
      required: [id, assetId, kind, performedOn, summary, createdAt]
      description: >
        Lo que se hizo, y cuándo. Es un LIBRO: se escribe y no se toca, así que no
        lleva updatedAt ni tiene operación de modificar.
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        planId:
          type: string
          format: uuid
          nullable: true
          description: El plan que cumple, si cumple alguno
        kind: { $ref: "#/components/schemas/InterventionKind" }
        performedOn: { type: string, format: date }
        summary: { type: string, example: Revisada y limpiada }
        supplierId: { type: string, format: uuid, nullable: true }
        supplier:
          type: string
          nullable: true
          description: >
            EL NOMBRE DE AQUEL DÍA, copiado al registrar. Al revés que en un plan,
            porque una intervención es historia: sigue siendo cierto aunque el
            contacto se retire o el hogar apague Proveedores
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    MaintenanceInterventionPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/MaintenanceIntervention" }

    MaintenanceInterventionInput:
      type: object
      required: [assetId, kind, performedOn, summary]
      properties:
        assetId: { type: string, format: uuid }
        planId:
          type: string
          format: uuid
          nullable: true
          description: >
            Opcional. Solo una PREVENTIVE puede colgar de un plan, y hacerlo es lo
            que AVANZA su próxima fecha
        kind: { $ref: "#/components/schemas/InterventionKind" }
        performedOn:
          type: string
          format: date
          description: No puede ser del futuro
        summary: { type: string, maxLength: 500 }
        supplierId: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }

    MaintenanceSupplier:
      type: object
      required: [id, name]
      description: >
        Lo mínimo que el puerto de dato maestro deja pasar, igual que en
        purchasing. Ni teléfono ni correo: los datos personales de terceros se
        quedan en Proveedores
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        detail:
          type: string
          nullable: true
          description: >
            El IDENTIFICADOR de la categoría de servicio, no su rótulo. Es con lo
            que el cliente AGRUPA el selector, y la razón de que este módulo NO
            haya tenido que ensanchar el puerto
